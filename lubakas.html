<title>Lubakas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;900&family=Rubik:wght@800&display=swap">
<style>
/* Layout: a blocky game world. Sky above, a strip of grass blocks below; every panel and button is a chunky block
   with a dark outline and a hard bottom edge that presses down when tapped. Colour codes the modes. */
:root{
  --sky1:#6EC1FF; --sky2:#C9ECFF; --grass:#56C043; --grass2:#46A836; --dirt:#9A6A44;
  --card:#FFFFFF; --panel2:#F3F6FF; --edge:#1D1F45; --ink:#1D1F45; --muted:#5E6488;
  --line:#D4DAF0; --grid:#E7EBF8; --paper:#F3F6FF;
  --accent:#FFC42E; --accent-soft:#FFF0C4; --blue:#3E7BFF; --pink:#FF5A8C; --purple:#8C5BFF; --orange:#FF8A2B;
  --ok:#22B356; --ok-soft:#DBF7E4; --bad:#F0434A; --bad-soft:#FFE0E1;
  --road:#6A6F92; --roadline:#FFFFFF; --verge:#9AD97C;
  --onc:#FFFFFF; /* text on coloured blocks */ --title:#FFFFFF;
  --f-display:"Lilita One","Rubik","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  --f-mono:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky1:#141B45; --sky2:#2A2F6B; --grass:#2F8F3A; --grass2:#257630; --dirt:#5E3F29;
  --card:#262C5C; --panel2:#1E2350; --edge:#090A1E; --ink:#F2F4FF; --muted:#A9AFD6;
  --line:#3A4178; --grid:#30366A; --paper:#1E2350;
  --accent:#FFC42E; --accent-soft:#4A3D17; --blue:#5B8FFF; --pink:#FF6F9B; --purple:#9C74FF; --orange:#FF9A45;
  --ok:#36D06D; --ok-soft:#173D28; --bad:#FF5F65; --bad-soft:#47202A;
  --road:#4A4F72; --roadline:#E8EBFF; --verge:#2F6B33; color-scheme:dark }}
:root[data-theme="dark"]{
  --sky1:#141B45; --sky2:#2A2F6B; --grass:#2F8F3A; --grass2:#257630; --dirt:#5E3F29;
  --card:#262C5C; --panel2:#1E2350; --edge:#090A1E; --ink:#F2F4FF; --muted:#A9AFD6;
  --line:#3A4178; --grid:#30366A; --paper:#1E2350;
  --accent:#FFC42E; --accent-soft:#4A3D17; --blue:#5B8FFF; --pink:#FF6F9B; --purple:#9C74FF; --orange:#FF9A45;
  --ok:#36D06D; --ok-soft:#173D28; --bad:#FF5F65; --bad-soft:#47202A;
  --road:#4A4F72; --roadline:#E8EBFF; --verge:#2F6B33; color-scheme:dark }
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--sky2);background-image:linear-gradient(180deg,var(--sky1),var(--sky2) 70%);background-attachment:fixed;
  color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;font-weight:600}
/* pixel clouds and a ground strip of grass blocks */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background:
   linear-gradient(var(--card),var(--card)) 8% 70px/96px 24px no-repeat,
   linear-gradient(var(--card),var(--card)) calc(8% + 24px) 46px/48px 24px no-repeat,
   linear-gradient(var(--card),var(--card)) 82% 140px/120px 24px no-repeat,
   linear-gradient(var(--card),var(--card)) calc(82% + 24px) 116px/48px 24px no-repeat}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:calc(34px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:0;
  background:
   repeating-linear-gradient(90deg,var(--grass) 0 34px,var(--grass2) 34px 68px) top/100% 12px no-repeat,
   repeating-linear-gradient(90deg,var(--dirt) 0 17px,color-mix(in srgb,var(--dirt) 85%,#000) 17px 34px);
  border-top:3px solid var(--edge)}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding-block:16px 80px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.1;letter-spacing:.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.card{background:var(--card);border:3px solid var(--edge);border-radius:var(--r);box-shadow:0 6px 0 var(--edge);padding:22px}
.btn{font-family:var(--f-display);font-size:19px;letter-spacing:.02em;background:var(--accent);color:#1D1F45;border:3px solid var(--edge);border-radius:12px;
  padding:11px 22px;box-shadow:0 5px 0 var(--edge);transition:transform .07s,box-shadow .07s;min-height:50px}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--edge)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn:disabled{opacity:.45;pointer-events:none}
.eyebrow{font-family:var(--f-body);font-weight:900;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.hidden{display:none!important}

/* Top bar: level block, XP blocks, streak */
.player{display:flex;align-items:center;gap:12px;background:var(--card);border:3px solid var(--edge);border-radius:var(--r);box-shadow:0 5px 0 var(--edge);padding:10px 14px}
.lvl{flex:none;width:54px;height:54px;display:grid;place-items:center;background:var(--purple);color:var(--onc);border:3px solid var(--edge);border-radius:10px;
  font-family:var(--f-display);font-size:26px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18);line-height:1}
.lvl small{display:block;font-family:var(--f-body);font-weight:900;font-size:9px;letter-spacing:.08em;margin-top:-6px}
.xp{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.xp b{font-family:var(--f-display);font-weight:400;font-size:17px}
.blocks{display:flex;gap:4px}
.blocks i{flex:1;height:14px;border-radius:3px;background:var(--grid);border:2px solid var(--edge)}
.blocks i.on{background:var(--accent);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:3px solid var(--edge);border-radius:999px;padding:4px 12px 4px 6px;font-family:var(--f-display);font-size:20px}
.chip svg{width:28px;height:28px}

/* Start */
.hero{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.hero h1{font-size:clamp(58px,15vw,104px);color:var(--title);-webkit-text-stroke:4px var(--edge);paint-order:stroke fill;
  text-shadow:0 7px 0 var(--edge);transform:rotate(-2deg);transform-origin:left;line-height:.95;margin-top:6px}
.hero h1 span{color:var(--accent)}
.hero .lead{font-size:18px;max-width:56ch;background:var(--card);border:3px solid var(--edge);border-radius:12px;padding:10px 14px;box-shadow:0 4px 0 var(--edge)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.mode{--c:var(--blue);text-align:left;background:var(--c);color:var(--onc);border:3px solid var(--edge);border-radius:var(--r);padding:16px;display:flex;gap:14px;align-items:center;
  box-shadow:0 6px 0 var(--edge),inset 0 -8px 0 rgba(0,0,0,.14);transition:transform .07s,box-shadow .07s;min-height:96px}
.mode:hover{transform:translateY(-3px);box-shadow:0 9px 0 var(--edge),inset 0 -8px 0 rgba(0,0,0,.14)}
.mode:active{transform:translateY(5px);box-shadow:0 1px 0 var(--edge),inset 0 -8px 0 rgba(0,0,0,.14)}
.mode>svg{width:60px;height:60px;flex:none;background:var(--card);border:3px solid var(--edge);border-radius:12px;padding:6px}
.mode b{font-family:var(--f-display);font-weight:400;font-size:24px;display:block;line-height:1.05}
.mode small{opacity:.95;font-size:15px;line-height:1.3;display:block;margin-top:4px;font-weight:700}
.mode span{min-width:0;overflow-wrap:anywhere}
.mode[data-go="exam"]{--c:var(--accent);color:#1D1F45}
.mode[data-go="mix"]{--c:var(--ok)}
.mode[data-go="redo"]{--c:var(--pink)}
.mode[data-go="atlas"]{--c:var(--blue)}
.mode[data-go="challenge"]{--c:var(--purple)}
@media (min-width:640px){.mode.primary{grid-column:span 2;min-height:120px}.mode.primary b{font-size:32px}}
.topics{display:flex;flex-direction:column;gap:10px}
.topic{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;text-align:left;background:var(--panel2);border:3px solid var(--edge);border-radius:12px;padding:10px 14px;
  box-shadow:0 4px 0 var(--edge);transition:transform .07s,box-shadow .07s}
.topic:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--edge)}
.topic:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.topic b{font-family:var(--f-display);font-weight:400;font-size:19px}
.topic .pct{font-family:var(--f-display);font-size:17px;color:var(--muted)}
.bar{grid-column:1/-1;height:14px;border-radius:4px;background:var(--grid);overflow:hidden;border:2px solid var(--edge);
  background-image:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),var(--edge) calc(10% - 2px) 10%)}
.bar i{display:block;height:100%;background:var(--ok);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--panel2);border:3px solid var(--edge);border-radius:12px;padding:10px 12px;min-width:0}
.stat .v{font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .k{font-size:14px;color:var(--muted);font-weight:700}
.note{font-size:14px;color:var(--muted);font-weight:600}
.note a{color:inherit}
.footnote{background:var(--card);border:3px solid var(--edge);border-radius:12px;padding:10px 14px;opacity:.92}

/* Question */
.hud{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.hud .btn{min-height:44px;font-size:16px;padding:6px 14px}
.hud .eyebrow{color:var(--ink);background:var(--card);border:3px solid var(--edge);border-radius:999px;padding:4px 12px}
.count{font-family:var(--f-display);font-size:22px;background:var(--card);border:3px solid var(--edge);border-radius:10px;padding:2px 12px}
.segs{display:flex;gap:5px}
.segs i{flex:1;height:18px;border-radius:5px;background:var(--card);border:3px solid var(--edge)}
.segs i.r{background:var(--ok)}.segs i.w{background:var(--bad)}.segs i.cur{background:var(--accent);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{background:var(--accent-soft)}}
.progress{display:none}
.q{display:flex;flex-direction:column;gap:18px}
.q h2{font-size:clamp(22px,4.6vw,28px);line-height:1.2}
.fig{display:flex;justify-content:center;background:var(--panel2);border:3px solid var(--edge);border-radius:12px;padding:14px}
.fig svg{width:min(100%,300px);height:auto;border-radius:8px}
.fig.sign{background:var(--sky2)}
.opts{display:flex;flex-direction:column;gap:12px}
.quip{font-style:italic;color:var(--muted)}
.streak{display:flex;gap:12px;align-items:center;background:var(--card);border:3px solid var(--edge);border-radius:var(--r);padding:10px 14px;box-shadow:0 5px 0 var(--edge)}
.streak>svg{width:44px;height:44px;flex:none;background:var(--orange);border:3px solid var(--edge);border-radius:10px;padding:4px}
.streak b{font-family:var(--f-display);font-weight:400;font-size:30px}.streak small{display:block;color:var(--muted);font-size:14px;font-weight:700}
.awards{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.aw{background:var(--panel2);border:3px solid var(--edge);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;filter:grayscale(1);opacity:.55}
.aw.on{filter:none;opacity:1;background:var(--accent-soft);box-shadow:0 4px 0 var(--edge)}
.aw svg{width:40px;height:40px}.aw b{font-family:var(--f-display);font-weight:400;font-size:15px;line-height:1.15}.aw small{font-size:12px;color:var(--muted);line-height:1.25;font-weight:700}
.titleline{display:flex;flex-direction:column;gap:2px}.titleline b{font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--purple)}
.vs{font-family:var(--f-display);font-size:20px}
.share{display:flex;flex-direction:column;gap:8px;background:var(--panel2);border:3px solid var(--edge);border-radius:12px;padding:12px}
.share b{font-family:var(--f-display);font-weight:400;font-size:19px}
.share textarea,.codein{font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--edge);border-radius:10px;padding:10px;width:100%;resize:vertical}
.codein{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:calc(56px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px) scale(.9);opacity:0;background:var(--accent);color:#1D1F45;
  border:3px solid var(--edge);box-shadow:0 5px 0 var(--edge);padding:10px 18px;border-radius:12px;font-family:var(--f-display);font-size:19px;transition:all .25s;z-index:20;max-width:calc(100% - 32px)}
.toast.in{transform:translate(-50%,0) scale(1);opacity:1}
.langs{display:inline-flex;border:3px solid var(--edge);border-radius:10px;overflow:hidden;box-shadow:0 3px 0 var(--edge)}
.lng{background:var(--card);border:0;padding:6px 12px;font-family:var(--f-display);font-size:15px;letter-spacing:.06em;min-height:40px}
.lng.on{background:var(--blue);color:var(--onc)}
.opts.grid{display:grid;grid-template-columns:1fr 1fr}
.osign svg,.osign img{width:88px;height:88px;object-fit:contain;display:block}
.fig.sign img{width:160px;height:160px;object-fit:contain}
.sg img{width:72px;height:72px;object-fit:contain}
.snum{font-family:var(--f-display);font-size:14px;color:var(--onc);background:var(--edge);border-radius:6px;padding:0 7px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:3px solid var(--edge);border-radius:12px;padding:12px 14px;font-weight:700;min-height:62px;
  box-shadow:0 5px 0 var(--edge);transition:transform .07s,box-shadow .07s,background .15s}
.opt:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--edge)}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.opt .l{flex:none;width:38px;height:38px;display:grid;place-items:center;border:3px solid var(--edge);border-radius:9px;background:var(--blue);color:var(--onc);
  font-family:var(--f-display);font-size:20px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.opt:nth-child(2) .l{background:var(--ok)}.opt:nth-child(3) .l{background:var(--pink)}.opt:nth-child(4) .l{background:var(--purple)}
.opt>span:last-child{min-width:0}
.opt.sel{background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:#1D1F45}
.opt.right{background:var(--ok-soft);border-color:var(--ok);animation:pop .35s}
.opt.right .l{background:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);animation:shake .4s}
.opt.wrong .l{background:var(--bad)}
.opt.locked{pointer-events:none}
@keyframes pop{40%{transform:scale(1.04)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.explain{border:3px solid var(--edge);background:var(--ok-soft);padding:14px 16px;border-radius:12px;display:flex;flex-direction:column;gap:6px;box-shadow:0 5px 0 var(--edge)}
.explain.bad{background:var(--bad-soft)}
.explain b{font-family:var(--f-display);font-weight:400;font-size:24px;color:var(--ok)}
.explain.bad b{color:var(--bad)}
.src{font-size:13px;color:var(--muted)}
.src::before{content:"§ ";font-weight:900}
.tag{display:inline-block;font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--blue);color:var(--onc);border:2px solid var(--edge);border-radius:999px;padding:2px 10px}
.tag.safe{background:var(--bad)}
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dot{width:32px;height:32px;border:3px solid var(--edge);border-radius:7px;background:var(--card);font-family:var(--f-display);font-size:14px;padding:0;display:grid;place-items:center;color:var(--ink)}
.dot.ans{background:var(--accent);color:#1D1F45}
.dot.cur{outline:3px solid var(--card);outline-offset:1px;transform:translateY(-3px);box-shadow:0 3px 0 var(--edge)}
.dot.r{background:var(--ok);color:var(--onc)}
.dot.w{background:var(--bad);color:var(--onc)}
.clock{font-family:var(--f-display);font-size:26px;background:var(--card);border:3px solid var(--edge);border-radius:10px;padding:2px 14px;font-variant-numeric:tabular-nums}
.clock.low{background:var(--bad);color:var(--onc);animation:pop 1s infinite}

/* Results */
.big{font-family:var(--f-display);font-size:clamp(56px,13vw,88px);line-height:1;color:var(--title);-webkit-text-stroke:3px var(--edge);paint-order:stroke fill;text-shadow:0 5px 0 var(--edge)}
.verdict{display:inline-block;padding:6px 16px;border:3px solid var(--edge);border-radius:12px;font-family:var(--f-display);font-size:26px;transform:rotate(-4deg);box-shadow:0 5px 0 var(--edge)}
.verdict.ok{background:var(--ok);color:var(--onc)}
.verdict.bad{background:var(--bad);color:var(--onc)}
.review{display:flex;flex-direction:column;gap:12px}
.rv{background:var(--panel2);border:3px solid var(--edge);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.rv .a{font-size:15px}

/* Atlas */
.atlas{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.sg{min-width:0;border:3px solid var(--edge);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--panel2);box-shadow:0 4px 0 var(--edge)}
.sg b{font-family:var(--f-display);font-weight:400;font-size:17px;line-height:1.15;overflow-wrap:anywhere;hyphens:auto}
.sg small{font-size:13px;color:var(--muted);line-height:1.35;font-weight:700}
.grp{font-family:var(--f-display);font-size:26px;margin-top:8px}

/* Confetti blocks on a right answer */
.boom{position:fixed;width:12px;height:12px;border:2px solid var(--edge);border-radius:2px;pointer-events:none;z-index:30;animation:boom .8s ease-out forwards}
@keyframes boom{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.boom{display:none}.hero h1{transform:none}}
@media (max-width:480px){.card{padding:16px}.stat .v{font-size:24px}.mode{min-height:84px}.mode b{font-size:22px}.opt{padding:10px 12px}}
</style>

<main class="wrap" id="app"></main>
<script>
/* ============ SIGNS ============ */
const RED="#D0202A", BLUE="#1F5FBF", YEL="#F2C230", BLK="#18203A";
const W=s=>`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${s}</svg>`;
const warn=i=>`<path d="M50 7 L95 88 H5 Z" fill="#fff" stroke="${RED}" stroke-width="8" stroke-linejoin="round"/>${i}`;
const ring=i=>`<circle cx="50" cy="50" r="44" fill="#fff" stroke="${RED}" stroke-width="10"/>${i}`;
const blueC=i=>`<circle cx="50" cy="50" r="46" fill="${BLUE}" stroke="#fff" stroke-width="2"/>${i}`;
const blueS=i=>`<rect x="5" y="5" width="90" height="90" rx="8" fill="${BLUE}" stroke="#fff" stroke-width="2"/>${i}`;
const person=(x,y,s=1,c=BLK)=>`<g transform="translate(${x} ${y}) scale(${s})" stroke="${c}" stroke-width="5" stroke-linecap="round" fill="none"><circle cx="0" cy="-22" r="5" fill="${c}" stroke="none"/><path d="M0 -15 L-2 2 M-2 2 L-9 16 M-2 2 L6 16 M0 -12 L-9 -3 M0 -12 L9 -5"/></g>`;
const car=(x,y,c,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><path d="M-14 4 V-4 Q-12 -9 -8 -10 L-5 -16 H5 L8 -10 Q12 -9 14 -4 V4 Z" fill="${c}"/><circle cx="-8" cy="5" r="4" fill="${c}"/><circle cx="8" cy="5" r="4" fill="${c}"/><rect x="-4" y="-14" width="8" height="4" fill="#fff"/></g>`;
function arcArrow(cx,cy,r,a0,a1,c="#fff",w=7){ // angles in degrees, counterclockwise on screen when a1<a0
  const p=a=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];
  const [x0,y0]=p(a0),[x1,y1]=p(a1);

/* 240x240 crossroads, right-hand traffic. Cars are drawn for the "from south" case and rotated.
   dir: S=0, W=90, N=180, E=270 (degrees clockwise). turn: s(traight), l(eft), r(ight). */
const ROT={S:0,W:90,N:180,E:270};
function rotPt(x,y,deg){const a=deg*Math.PI/180,cx=120,cy=120;return [cx+(x-cx)*Math.cos(a)-(y-cy)*Math.sin(a),cy+(x-cx)*Math.sin(a)+(y-cy)*Math.cos(a)]}
function crossSvg(o){
  const roads=o.roads||"NSWE";
  let s=`<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ristmiku skeem">`;
  s+=`<rect width="240" height="240" fill="var(--verge)"/>`;
  if(roads.includes("N")||roads.includes("S")) s+=`<rect x="80" y="${roads.includes("N")?0:80}" width="80" height="${(roads.includes("N")?80:0)+80+(roads.includes("S")?80:0)}" fill="var(--road)"/>`;
  if(roads.includes("W")||roads.includes("E")) s+=`<rect y="80" x="${roads.includes("W")?0:80}" height="80" width="${(roads.includes("W")?80:0)+80+(roads.includes("E")?80:0)}" fill="var(--road)"/>`;
  const dash=`stroke="var(--roadline)" stroke-width="2" stroke-dasharray="10 8"`;
  if(roads.includes("N")) s+=`<path d="M120 0 V76" ${dash}/>`;
  if(roads.includes("S")) s+=`<path d="M120 164 V240" ${dash}/>`;
  if(roads.includes("W")) s+=`<path d="M0 120 H76" ${dash}/>`;
  if(roads.includes("E")) s+=`<path d="M164 120 H240" ${dash}/>`;
  if(o.tram){s+=`<path d="M114 0 V240 M126 0 V240" stroke="#9AA3B5" stroke-width="2"/>`}
  // signs at approaches (placed on the right-hand verge of each approach)
  for(const [d,id] of Object.entries(o.signs||{})){
    const [x,y]=rotPt(178,180,ROT[d]);
    s+=`<image href="${signUrl(id)}" x="${(x-16).toFixed(0)}" y="${(y-16).toFixed(0)}" width="32" height="32" preserveAspectRatio="xMidYMid meet"/>`;
  }
  const paths={s:"M140 176 V18",r:"M140 176 Q140 140 176 140 H226",l:"M140 176 Q140 100 100 100 H14"};
  for(const c of o.cars||[]){
    const deg=ROT[c.from], col=c.tram?"#2F7BEA":(c.color||"#E39B12");
    s+=`<g transform="rotate(${deg} 120 120)">`;
    s+=`<path d="${c.tram?paths[c.turn].replace("M140","M120").replace("V18","V18"):paths[c.turn]}" fill="none" stroke="${col}" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round"/>`;
    // arrowhead at end
    const ends={s:"M133 22 L140 8 L147 22 Z",r:"M222 133 L236 140 L222 147 Z",l:"M18 93 L4 100 L18 107 Z"};
    s+=`<path d="${ends[c.turn]}" fill="${col}" ${c.tram&&c.turn==="s"?'transform="translate(-20 0)"':""}/>`;
    if(c.tram) s+=`<rect x="${c.from==="N"||c.from==="S"?108:126}" y="176" width="24" height="56" rx="4" fill="${col}" stroke="${BLK}" stroke-width="1.5"/>`;
    else s+=`<rect x="128" y="180" width="24" height="40" rx="6" fill="${col}" stroke="${BLK}" stroke-width="1.5"/><rect x="131" y="186" width="18" height="8" rx="2" fill="#fff" opacity=".7"/>`;
    s+=`</g>`;
    const [lx,ly]=rotPt(c.tram?(c.from==="N"||c.from==="S"?120:138):140,c.tram?212:204,deg);
    s+=`<text x="${lx.toFixed(0)}" y="${(ly+6).toFixed(0)}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-weight="700" font-size="16" fill="${BLK}">${c.label}</text>`;
  }
  for(const p of o.peds||[]){const [x,y]=rotPt(p[0],p[1],0);s+=person(x,y,.7)}
  return s+`</svg>`;
}

  o:["Auto 2","Auto 1","Auto 1, sest ta näitas suunatuld","Kumbki ei pea teed andma"],e:"Vasakule pöörav juht peab andma teed vastassuunast otse sõitvale ja paremale pööravale sõidukile. Suunatuli ei anna eesõigust.",s:LS+", vasakpöörde nõuded"},
 {id:"e3",t:"eesoigus",q:"Ristmikul on peatee põhja–lõuna suunas. Auto 1 tuleb kõrvalteelt (märk „Anna teed“), auto 2 sõidab peateel. Kes sõidab esimesena?",f:crossSvg({signs:{E:"anna",W:"anna",S:"peatee",N:"peatee"},cars:[{from:"E",turn:"s",label:"1"},{from:"S",turn:"s",label:"2",color:"#2FA35B"}]}),
  o:["Auto 2, sest ta on peateel","Auto 1, sest auto 2 tuleb talle vasakult","Mõlemad korraga","Auto 1, sest ta jõudis ristmikule varem"],e:"Märk „Anna teed“ kohustab andma teed peateel liiklejatele. Parema käe reegel kehtib ainult samaliigiliste teede ristmikul.",s:LKV+"; "+LS+", eesõigus ristmikul"},
 {id:"e4",t:"eesoigus",q:"Samaliigiliste teede ristmik, kõik sõidavad otse. Mis järjekorras sõidukid ristmiku läbivad?",f:crossSvg({roads:"NSWE",cars:[{from:"S",turn:"s",label:"1"},{from:"W",turn:"s",label:"2",color:"#2FA35B"},{from:"E",turn:"s",label:"3",color:"#9B5CD6"}]}),
  o:["Auto 3, auto 1, auto 2","Auto 1, auto 2, auto 3","Auto 2, auto 1, auto 3","Auto 3, auto 2, auto 1"],e:"Autol 3 pole paremal kedagi, seega sõidab ta esimesena. Seejärel auto 1, kelle paremal oli auto 3. Viimasena auto 2, kelle paremal on auto 1.",s:LS+", parema käe reegel"},
 {id:"e5",t:"eesoigus",q:"Samaliigiliste teede ristmik. Tramm (T) sõidab otse, auto 1 sõidab otse. Kes sõidab esimesena?",f:crossSvg({tram:true,cars:[{from:"N",turn:"s",label:"T",tram:true},{from:"W",turn:"s",label:"1"}]}),
  o:["Tramm","Auto, sest tramm tuleb talle vasakult","Mõlemad korraga","See, kes annab helisignaali"],e:"Samaliigiliste teede ristmikul on trammil eesõigus rööbasteta sõidukite ees, sõltumata sellest, kummalt poolt ta tuleb.",s:LS+", trammi eesõigus ristmikul"},
 {id:"e6",t:"eesoigus",q:"Samaliigiliste teede ristmik. Auto 1 pöörab paremale, auto 2 pöörab vastassuunast vasakule samale teele. Kes sõidab esimesena?",f:crossSvg({roads:"NSE",cars:[{from:"S",turn:"r",label:"1"},{from:"N",turn:"l",label:"2",color:"#2FA35B"}]}),
  o:["Auto 1","Auto 2","Mõlemad korraga, sest sõidavad eri radadele","Auto 2, sest ta tuleb peateelt"],e:"Vasakule pöörav auto 2 peab andma teed vastassuunast otse sõitvale ja paremale pööravale sõidukile.",s:LS+", vasakpöörde nõuded"},
 {id:"e7",t:"eesoigus",q:"Sõidad hoovist (kõrvalalalt) teele. Kellele pead teed andma?",o:["Kõigile teel liiklejatele, ka jalakäijatele","Ainult paremalt tulevatele sõidukitele","Ainult jalakäijatele","Kellelegi, kui näitad suunatuld"],e:"Kõrvalalalt (hoovist, parklast, tanklast) teele sõitev juht peab andma teed kõigile teel liiklejatele.",s:LS+", kõrvalalalt teele sõitmine"},
 {id:"e8",t:"eesoigus",q:"Märk STOP on ristmiku ees, ristuval teel pole ühtegi sõidukit. Mida teed?",f:"sign:stop",o:["Peatun stoppjoone ees ja sõidan siis edasi","Aeglustan ja sõidan peatumata edasi","Peatun ainult siis, kui keegi läheneb","Peatun märgi juures, kuigi stoppjoon on eespool"],e:"STOP-märgi juures tuleb alati peatuda, ka tühja ristuva tee korral.",s:LKV},
 {id:"e9",t:"eesoigus",q:"Ringristmiku sissesõidul on märk „Anna teed“. Ringil sõidab auto. Mida teed?",o:["Annan teed ringil sõitvale autole","Sõidan esimesena, sest auto on mulle vasakul","Sõidan, kui näitan parempoolset suunatuld","Ringil sõitja peab mulle teed andma"],e:"Märk „Anna teed“ ringristmiku sissesõidul kohustab andma teed ringil liikuvatele sõidukitele.",s:LKV+"; "+LS},
 {id:"e10",t:"eesoigus",q:"Asulas hakkab tähistatud peatusest sõitu alustama buss, mis annab suunatulega märku. Mida pead tegema?",o:["Võimaldama bussil sõitu alustada, vajadusel aeglustades","Jätkama sõitu, sest mul on eesõigus","Andma helisignaali","Mööda sõitma vastassuunavööndi kaudu"],e:"Asulas peab juht andma teed bussile, mis alustab sõitu tähistatud peatusest ja annab sellest suunatulega märku.",s:LS+", ühissõiduki eelistamine asulas"},
 {id:"e11",t:"eesoigus",q:"Sinu taga läheneb sõiduk, millel vilgub sinine vilkur ja töötab erihelisignaal. Mida teed?",o:["Annan teed, vajadusel peatun tee servas","Jätkan, sest operatiivsõiduk peab mind ise ümber sõitma","Jätkan samamoodi, sest mul on roheline tuli","Pidurdan järsult sõiduraja keskel"],e:"Sinise vilkuri ja erihelisignaaliga operatiivsõidukile tuleb teed anda ning vajadusel peatuda.",s:LS+", operatiivsõidukile teeandmine"},
 {id:"e12",t:"eesoigus",q:"Mida näitab peatee märgi all olev lisatahvel, millel ristmiku skeemil on üks teekaar jämeda joonega?",o:["Peatee suunda sellel ristmikul","Ümbersõidu marsruuti","Teetööde asukohta","Kohustuslikku sõidusuunda kõigile"],e:"Lisatahvel „Peatee suund“ näitab, kuhu peatee ristmikul pöördub.",s:LKV},
 // ---- Foor ----
 {id:"f1",t:"foor",q:"Mida tähendab vilkuv kollane foorituli?",o:["Ristmik on reguleerimata, juhindun märkidest ja eesõigusreeglitest","Pean peatuma nagu punase tule korral","Mul on alati eesõigus","Foor läheb kohe roheliseks"],e:"Vilkuv kollane tuli hoiatab ohu eest: liikumist foor ei reguleeri, kehtivad märgid ja eesõigusreeglid.",s:LS+" § 7"},
 {id:"f2",t:"foor",q:"Süttib kollane tuli, kuid oled stoppjoonele nii lähedal, et ohutult peatuda ei saa. Mida teed?",o:["Võin sõitu jätkata","Pidurdan igal juhul järsult","Tagurdan stoppjoone taha","Peatun ristmiku keskel"],e:"Kollane tuli keelab liikuda, välja arvatud juhul, kui juht ei saa enam ohutult peatuda.",s:LS+" § 7"},
 {id:"f3",t:"foor",q:"Roheline foorituli hakkab vilkuma. Mida see tähendab?",o:["Roheline tuli lõpeb varsti ja süttib kollane","Pean kohe peatuma","Foor on rikkis","Võin pöörata ka punase noole suunas"],e:"Vilkuv roheline teatab, et lubava tule aeg lõpeb peagi.",s:LS+" § 7"},
 {id:"f4",t:"foor",q:"Põlevad korraga punane ja kollane tuli. Mida see tähendab?",o:["Varsti süttib roheline, kuid liikuda veel ei tohi","Võin hakata liikuma","Foor on välja lülitatud","Pean ristmikult kiiresti lahkuma"],e:"Punane koos kollasega teatab rohelise tule süttimisest. Liikumine on endiselt keelatud.",s:LS+" § 7"},
 {id:"f5",t:"foor",q:"Põleb punane tuli, lisasektsioonis põleb roheline nool paremale. Mida tohid teha?",o:["Pöörata paremale, andes teed teistest suundadest liiklejatele ja jalakäijatele","Sõita otse","Pöörata paremale, sest mul on eesõigus kõigi ees","Mitte midagi, sest põleb punane"],e:"Lisasektsiooni roheline nool lubab liikuda noole suunas, kuid juht peab andma teed teistest suundadest liiklejatele.",s:LS+" § 7"},
 {id:"f6",t:"foor",q:"Reguleerija tõstab käe üles. Mida see tähendab?",o:["Kõigil on liikumine keelatud (v.a need, kes ei saa ohutult peatuda)","Kõik võivad liikuda","Ainult jalakäijad võivad liikuda","Liikuda tohib ainult otse"],e:"Ülestõstetud käsi keelab kõigil liiklejatel liikuda, nagu kollane foorituli.",s:LS+" § 10"},
 {id:"f7",t:"foor",q:"Reguleerija seisab sinu poole küljega, käed alla lastud või külgedele sirutatud. Mida tohid teha?",o:["Sõita otse ja paremale","Ainult vasakule pöörata","Mitte liikuda","Teha tagasipöörde"],e:"Kui reguleerija on liikleja poole küljega (käed küljele või alla), lubab ta sõita otse ja paremale. Jalakäijad tohivad ületada sõiduteed tema selja ja rinna eest.",s:LS+" § 10"},
 {id:"f8",t:"foor",q:"Ristmikul töötab foor ja reguleerija annab foorituledele vastupidiseid märguandeid. Kumba järgid?",o:["Reguleerijat","Foori","Liiklusmärke","Parema käe reeglit"],e:"Reguleerija märguanded on ülimuslikud foorituledele, märkidele ja teekattemärgistele.",s:LS+", liikluse korraldamise vahendite tähtsusjärjekord"},
 {id:"f9",t:"foor",q:"Ristmikul on märk „Anna teed“, aga foor näitab sulle rohelist tuld. Kumba järgid?",o:["Foori","Märki","Mõlemat: pean peatuma","Kumbagi, kehtib parema käe reegel"],e:"Foorituli on eesõigusmärkidest ülimuslik. Märgid kehtivad, kui foor on välja lülitatud või vilgub kollane.",s:LS+", liikluse korraldamise vahendite tähtsusjärjekord"},
 {id:"f10",t:"foor",q:"Põleb roheline tuli ja pöörad vasakule. Vastassuunast sõidab auto otse. Kes annab teed?",o:["Mina","Vastutulev auto","Kumbki, sest roheline lubab kõigil","See, kes on aeglasem"],e:"Ka rohelise tule ajal peab vasakule pöörav juht andma teed vastassuunast otse ja paremale sõitjatele.",s:LS+", vasakpöörde nõuded"},
 // ---- Kiirus ----
 {id:"k1",t:"kiirus",q:"Milline on suurim lubatud kiirus asulas, kui märgid ei näita teisiti?",o:["50 km/h","40 km/h","60 km/h","70 km/h"],e:"Asulasisesel teel on suurim lubatud kiirus 50 km/h.",s:LS+" § 15 lg 1 p 2"},
 {id:"k2",t:"kiirus",q:"Milline on suurim lubatud kiirus asulavälisel teel, kui märgid ei näita teisiti?",o:["90 km/h","100 km/h","110 km/h","80 km/h"],e:"Asulavälisel teel on suurim lubatud kiirus 90 km/h. Märgiga võib Transpordiamet seda oludest sõltuvalt tõsta.",s:LS+" § 15 lg 1 p 1"},
 {id:"k3",t:"kiirus",q:"Milline on suurim lubatud kiirus õuealal?",f:"sign:oueala",o:["20 km/h","10 km/h","30 km/h","Jalakäija kiirus alati"],e:"Õuealal on suurim lubatud kiirus 20 km/h. Jalakäija vahetus läheduses tohib sõita ainult jalakäija kiirusega.",s:LS+" § 15 lg 1 p 6"},
 {id:"k4",t:"kiirus",q:"Milline on suurim lubatud kiirus teise sõiduki pukseerimisel?",o:["50 km/h","30 km/h","70 km/h","90 km/h"],e:"Pukseerimisel on suurim lubatud kiirus 50 km/h.",s:LS+" § 15 lg 1 p 4"},
 {id:"k5",t:"kiirus",q:"Kas asulas võib märgiga lubada suuremat kiirust kui 50 km/h?",o:["Jah, kuni 90 km/h","Ei, asulas on alati kuni 50 km/h","Jah, kuni 120 km/h","Ainult öösel"],e:"Kohalik omavalitsus võib asulasisesel teel oludest sõltuvalt tõsta suurimat lubatud kiirust kuni 90 km/h.",s:LS+" § 15 lg 2"},
 {id:"k6",t:"kiirus",q:"Kui suure kiiruse võib Transpordiamet asulavälisel teel märgiga kõige rohkem lubada?",o:["120 km/h","110 km/h","130 km/h","100 km/h"],e:"Asulavälisel teel võib suurimat lubatud kiirust tõsta kuni 120 km/h. Suvel kehtib paljudel maanteedel 100 või 110 km/h, talvel taas madalam.",s:LS+" § 15 lg 2"},
 {id:"k7",t:"kiirus",q:"Märk näitab 90 km/h, kuid on tihe udu ja nähtavus on halb. Millise kiirusega sõidad?",o:["Nii, et jõuan peatuda nähtava teeosa piires","90 km/h, sest märk lubab","Vähemalt 70 km/h, et mitte liiklust takistada","Sõidan ohutuledega 90 km/h"],e:"Juht peab valima kiiruse vastavalt nähtavusele, teeoludele ja liiklusele. Piirkiirus on ülempiir, mitte soovitus.",s:LS+", sõidukiiruse valik",safe:true},
 {id:"k8",t:"kiirus",q:"Millest koosneb peatumisteekond?",o:["Reageerimisteekonnast ja pidurdusteekonnast","Ainult pidurdusteekonnast","Pidurdusteekonnast ja pikivahest","Reageerimisajast ja pikivahest"],e:"Peatumisteekond on teekond, mille sõiduk läbib ohu märkamisest kuni seismajäämiseni: juhi reageerimise ajal läbitud teekond pluss pidurdusteekond.",s:"Liiklusohutuse alused",safe:true},
 {id:"k9",t:"kiirus",q:"Kuidas muutub pidurdusteekond, kui kiirus kahekordistub (näiteks 40 → 80 km/h)?",o:["Umbes neli korda pikemaks","Kaks korda pikemaks","Jääb samaks","Poole lühemaks"],e:"Pidurdusteekond kasvab ligikaudu kiiruse ruudus: kaks korda suurem kiirus tähendab umbes neli korda pikemat pidurdusteekonda.",s:"Liiklusohutuse alused (füüsika)",safe:true},
 {id:"k10",t:"kiirus",q:"Kui suur peab olema pikivahe ees sõitva sõidukiga?",o:["Nii suur, et ees sõitja järsul pidurdusel jõuaksin kokkupõrketa peatuda","Täpselt 10 meetrit","Ühe auto pikkus","Pikivahe pole oluline, kui pidurid on korras"],e:"Seadus nõuab pikivahet, mis võimaldab kokkupõrget vältida. Rusikareegel kuival teel on vähemalt 2 sekundit, libedal tuleb vahet mitmekordistada.",s:LS+", pikivahe",safe:true},
 {id:"k11",t:"kiirus",q:"Kui suur on soovituslik minimaalne pikivahe kuival teel ajas mõõdetuna?",o:["Umbes 2 sekundit","Umbes 0,5 sekundit","Umbes 10 sekundit","Umbes 1 minut"],e:"Kahe sekundi reegel: kui eessõitja möödub mingist punktist, pead sina sinna jõudma alles umbes 2 sekundi pärast. Märjal ja libedal teel jäta rohkem.",s:"Liiklusohutuse alused (soovitus)",safe:true},
 {id:"k12",t:"kiirus",q:"Milline on mopeedi suurim lubatud kiirus?",o:["45 km/h","25 km/h","50 km/h","60 km/h"],e:"Mopeedi suurim lubatud kiirus on 45 km/h.",s:LS+" § 15 lg 1 p 9"},
 // ---- Manöövrid ----
 {id:"m1",t:"manoover",q:"Kummalt poolt tohib üldjuhul mööda sõita?",o:["Vasakult","Paremalt","Mõlemalt poolt","Paremalt, kui tee on lai"],e:"Möödasõit toimub vasakult. Paremalt tohib mööduda sõidukist, mille juht on andnud märku vasakpöördest ja asunud vasakpöördeks.",s:LS+", möödasõit"},
 {id:"m2",t:"manoover",q:"Sinust sõidab mööda teine sõiduk. Mida sa ei tohi teha?",o:["Kiirust suurendada ega muul viisil möödasõitu takistada","Hoida oma sõidurada","Jätkata sama kiirusega","Vaadata peeglisse"],e:"Juht, kellest möödutakse, ei tohi kiirust suurendada ega möödasõitu muul viisil takistada.",s:LS+", möödasõit"},
 {id:"m3",t:"manoover",q:"Kus on möödasõit keelatud?",o:["Raudteeülesõidukohal","Pikal sirgel asulavälisel teel","Kahesuunalisel teel hea nähtavusega","Kiirteel"],e:"Raudteeülesõidukohal on möödasõit keelatud. Keelatud on see ka näiteks reguleerimata ülekäigurajal ja halva nähtavusega kohas.",s:LS+", möödasõidu keelud"},
 {id:"m4",t:"manoover",q:"Kas suunatule näitamine annab sulle eesõiguse?",o:["Ei, see ainult teavitab teisi kavatsusest","Jah, alati","Jah, kui näitan seda vähemalt 3 sekundit","Ainult ringristmikul"],e:"Suunatuld tuleb näidata aegsasti enne manöövrit, kuid see ei anna eesõigust.",s:LS+", märguanded"},
 {id:"m5",t:"manoover",q:"Kus on tagasipööre keelatud?",o:["Raudteeülesõidukohal","Laial asulateel","Samaliigiliste teede ristmikul","Parklas"],e:"Tagasipööre on keelatud muu hulgas raudteeülesõidukohal, tunnelis ja kohtades, kus nähtavus on piiratud.",s:LS+", tagasipööre"},
 {id:"m6",t:"manoover",q:"Rivistud ümber kõrvalrajale. Samas suunas sõidab sellel rajal teine sõiduk. Kes annab teed?",o:["Mina, kes rivistun ümber","Kõrvalrajal sõitja","See, kes on aeglasem","Kumbki, sest märku andsin"],e:"Ümberrivistuja peab andma teed samas suunas kõrvalrajal sõitjale.",s:LS+", ümberrivistumine"},
 {id:"m7",t:"manoover",q:"Kaks sõidukit rivistuvad korraga teineteise suunas ümber samale rajale. Kes annab teed?",o:["Vasakpoolne annab teed parempoolsele","Parempoolne annab teed vasakpoolsele","Aeglasem annab teed","Suurem sõiduk annab teed"],e:"Samaaegsel ümberrivistumisel annab vasakul olev juht teed paremal olevale.",s:LS+", ümberrivistumine"},
 {id:"m8",t:"manoover",q:"Raudteeülesõidukohal on tõkkepuu laskumas ja punased tuled vilguvad. Mida teed?",o:["Peatun ega sõida ülesõidukohale","Sõidan kiiresti üle enne tõkkepuu sulgumist","Sõidan üle, kui rongi ei paista","Sõidan tõkkepuust mööda vastassuunavööndi kaudu"],e:"Vilkuvad punased tuled ja laskuv või suletud tõkkepuu keelavad ülesõidukohale sõitmise.",s:LS+", raudteeülesõidukoht",safe:true},
 {id:"m9",t:"manoover",q:"Mida tuleb teha enne paremale pööramist?",o:["Asuda aegsasti tee parema serva lähedale ja näidata suunatuld","Asuda tee keskele","Näidata suunatuld alles pöörde ajal","Kiirendada, et pööre kiiresti lõpetada"],e:"Enne paremale pööramist asub juht aegsasti sõidutee parema serva lähedale ja annab suunatulega märku.",s:LS+", pööramine"},
 {id:"m10",t:"manoover",q:"Mis on kiirteel keelatud?",o:["Tagasipööre ja tagurdamine","Sõitmine vasakpoolsel sõidurajal möödasõiduks","Sõitmine kiirusega 90 km/h","Suunatule kasutamine"],e:"Kiirteel on keelatud tagasipööre, tagurdamine ja sõitmine eraldusriba vaheavadest.",s:LS+", kiirteel sõitmine"},
 {id:"m11",t:"manoover",q:"Tagurdamisel ei näe sa hästi, mis on auto taga. Mida peaksid tegema?",o:["Veenduma ohutuses, vajadusel kasutama kõrvalise isiku abi","Tagurdama kiiresti, et mitte kaua takistada","Lootma ainult helisignaalile","Tagurdama ohutuledega"],e:"Tagurdades peab juht veenduma, et see on ohutu, ja vajaduse korral kasutama kõrvalise isiku abi.",s:LS+", tagurdamine"},
 // ---- Peatumine ----
 {id:"p1",t:"parkimine",q:"Mis vahe on märkidel „Peatumise keeld“ ja „Parkimise keeld“?",f:"sign:parkimiskeeld",o:["Parkimiskeelu korral tohib lühidalt peatuda, peatumiskeelu korral mitte","Vahet pole","Peatumiskeeld kehtib ainult öösel","Parkimiskeeld kehtib ainult veokitele"],e:"Peatumise keeld (rist) keelab ka lühiajalise peatumise. Parkimise keeld (üks kriips) lubab peatuda, näiteks reisijate peale ja maha minekuks.",s:LKV},
 {id:"p2",t:"parkimine",q:"Kui lähedal ülekäigurajale tohib selle ees peatuda?",o:["Mitte lähemal kui 5 m","Mitte lähemal kui 1 m","Vahetult ülekäiguraja ees","Mitte lähemal kui 50 m"],e:"Peatumine on keelatud ülekäigurajal ja lähemal kui 5 m enne seda, et seisev auto ei varjaks jalakäijaid.",s:LS+", peatumise keelud"},
 {id:"p3",t:"parkimine",q:"Kus on peatumine keelatud?",o:["Raudteeülesõidukohal","Parklas","Teepeenral, kui märk lubab","Tee paremas servas asulas"],e:"Peatumine on keelatud muu hulgas raudteeülesõidukohal, tunnelis ja ülekäigurajal.",s:LS+", peatumise keelud"},
 {id:"p4",t:"parkimine",q:"Asulas ühesuunalise sõiduteega teel tahad peatuda. Kummas servas tohib?",o:["Paremas või vasakus servas","Ainult paremas servas","Ainult vasakus servas","Ainult sõidutee keskel"],e:"Üldjuhul peatutakse paremas servas, kuid asulas ühesuunalise sõiduteega teel võib peatuda ka vasakus servas.",s:LS+", peatumine ja parkimine"},
 {id:"p5",t:"parkimine",q:"Lähed seisvast autost välja vasakpoolse ukse kaudu. Mida pead tegema?",o:["Veenduma, et ukse avamine ei ohusta teisi, näiteks jalgratturit","Avama ukse kiiresti, et mitte liiklust takistada","Andma helisignaali","Mitte midagi erilist"],e:"Sõiduki ust tohib avada alles siis, kui see ei ohusta ega takista teisi liiklejaid.",s:LS+", sõitjate kohustused",safe:true},
 {id:"p6",t:"parkimine",q:"Mida tuleb teha enne autost lahkumist, kui jätad selle seisma?",o:["Rakendada seisupidur ja võtta meetmed, et auto ei hakkaks iseeneslikult liikuma","Jätta mootor tööle","Jätta auto käiku ilma seisupidurita","Lülitada sisse kaugtuled"],e:"Juht peab enne sõidukist lahkumist tagama, et sõiduk ei saaks iseeneslikult liikuma hakata ega seda saaks kasutada keegi kõrvaline.",s:LS+", juhi kohustused"},

function signDistractors(id){
  const me=SIGNS[id], twin={"221":"222","222":"221"}[id];
  const sim=shuffle(simOf(id).filter(k=>k!==twin)), same=shuffle(Object.keys(SIGNS).filter(k=>k!==id&&k!==twin&&SIGNS[k].g===me.g&&!sim.includes(k)));
  const d=[]; for(const k of [...sim,...same]){ if(d.length>=3) break; if(!d.some(x=>SIGNS[x].m===SIGNS[k].m)) d.push(k) }
  while(d.length<3){const k=pick(Object.keys(SIGNS));if(k!==id&&!d.includes(k))d.push(k)}
  return d;
}
function signOptions(id){ return [SIGNS[id].m,...signDistractors(id).map(k=>SIGNS[k].m)] }

/* ---- Intersection generator: endless right-of-way tasks, solved by the rules ---- */
const RIGHT_OF={S:"E",E:"N",N:"W",W:"S"}, OPP={S:"N",N:"S",E:"W",W:"E"}, TURN={s:"sõidab otse",l:"pöörab vasakule",r:"pöörab paremale"};
function pathPts(from,turn,tram){
  const P=[]; const deg=ROT[from]; const x0=tram?120:140;
  const add=(x,y)=>P.push(rotPt(x,y,deg));
  if(turn==="s"){for(let y=176;y>=18;y-=6)add(x0,y)}
  else if(turn==="r"){for(let t=0;t<=1;t+=.05){const u=1-t;add(u*u*140+2*u*t*140+t*t*176,u*u*176+2*u*t*140+t*t*140)}for(let x=180;x<=226;x+=6)add(x,140)}
  else{for(let t=0;t<=1;t+=.05){const u=1-t;add(u*u*140+2*u*t*140+t*t*100,u*u*176+2*u*t*100+t*t*100)}for(let x=96;x>=14;x-=6)add(x,100)}
  return P;
}
function conflict(a,b){const A=pathPts(a.from,a.turn,a.tram),B=pathPts(b.from,b.turn,b.tram);for(const p of A)for(const q of B)if(Math.hypot(p[0]-q[0],p[1]-q[1])<12)return true;return false}
// does a have to give way to b? returns {y:bool, why} or null when the case is not clear-cut
function yields(a,b,main){
  if(main){const am=main.includes(a.from),bm=main.includes(b.from); if(am!==bm) return {y:!am,why:am?null:"main"};}
  if(!main){ if(b.tram&&!a.tram) return {y:true,why:"tram"}; if(a.tram&&!b.tram) return {y:false}; }
  if(OPP[a.from]===b.from){ if(a.turn==="l"&&b.turn!=="l") return {y:true,why:"left"}; if(b.turn==="l"&&a.turn!=="l") return {y:false}; return null; }
  if(RIGHT_OF[a.from]===b.from) return {y:true,why:"right"};
  if(RIGHT_OF[b.from]===a.from) return {y:false};
  return null;
}
function reason(a,b,why,main,signs){ const A=a.nm[0].toUpperCase()+a.nm.slice(1), Bn=b.nm;
  if(LANG==="ru"){const G=RU.gen; if(why==="main")return G.rMain(A,b.dat,signs[a.from]==="stop"); if(why==="tram")return G.rTram(a.nm); if(why==="left")return G.rLeft(A,b.dat,G.turn[b.turn]); if(why==="right")return G.rRight(a.dat,b.nm,main); return "";}
  if(why==="main") return `${A} on kõrvalteel (märk „${signs[a.from]==="stop"?"STOP":"Anna teed"}“) ja peab andma teed peateel sõitvale ${Bn}-le.`;
  if(why==="tram") return `Samaliigiliste teede ristmikul on trammil eesõigus, seega ${a.nm} annab teed trammile.`;
  if(why==="left") return `Vasakule pöörav ${a.nm} annab teed vastassuunast tulevale ${Bn}-le, kes ${TURN[b.turn]}.`;
  if(why==="right") return `${main?"Mõlemad on samal teel, seega kehtib nende vahel parema käe reegel: ":"Parema käe reegel: "}${Bn} läheneb ${a.nm}-le paremalt.`;
  return "";
}
function solve(cars,main,signs){ // returns {order, steps} or null
  const left=cars.slice(), order=[], steps=[];
  while(left.length){
    const free=left.filter(c=>left.every(d=>{ if(d===c||!conflict(c,d)) return true; const r=yields(c,d,main); if(!r) throw 0; return !r.y }));
    if(free.length!==1) return null;
    const c=free[0];
    for(const d of left){ if(d!==c&&conflict(c,d)){ const r=yields(d,c,main); if(r&&r.y) steps.push(reason(d,c,r.why,main,signs)) } }
    order.push(c); left.splice(left.indexOf(c),1);
  }
  return {order,steps};
}
function genCross(kind){
  for(let tries=0;tries<400;tries++){
    const dirs=shuffle(["S","N","W","E"]), n=kind==="x3"?3:2;
    const cars=dirs.slice(0,n).map(d=>({from:d,turn:["s","l","r"][Math.floor(Math.random()*3)]}));
    let main=null, signs={}, tram=false;
    if(kind==="xm"){ main=Math.random()<.5?["N","S"]:["W","E"]; const stop=Math.random()<.3;
      for(const d of ["N","S","W","E"]) signs[d]=main.includes(d)?"peatee":(stop?"stop":"anna");
      if(!cars.some(c=>main.includes(c.from))||!cars.some(c=>!main.includes(c.from))) continue; }
    if(kind==="xt"){ const tc=cars.find(c=>c.from==="N"||c.from==="S"); if(!tc) continue; tc.tram=true; tc.turn="s"; tram=true;
      if(cars.some(c=>!c.tram&&(c.from==="N"||c.from==="S"))) continue; }
    const letters=shuffle(["1","2","3"].slice(0,n)); const G=RU.gen, ru=LANG==="ru"; cars.forEach((c,i)=>{c.label=c.tram?"T":letters[i];c.nm=ru?(c.tram?G.tram:G.car(letters[i])):(c.tram?"tramm":"auto "+letters[i]);c.dat=ru?(c.tram?G.tramDat:G.carDat(letters[i])):c.nm});
    if(cars.some((c,i)=>cars.some((d,j)=>j>i&&!conflict(c,d)))&&n===2) continue;
    let sol; try{ sol=solve(cars,main,signs) }catch(e){ continue }
    if(!sol) continue;
    const pal=["#E39B12","#2FA35B","#9B5CD6"];
    const fig=crossSvg({signs,tram,cars:cars.map((c,i)=>({...c,color:pal[i]}))});
    const moves=cars.map((c,i)=>`${i?c.nm:c.nm[0].toUpperCase()+c.nm.slice(1)} ${(ru?G.turn:TURN)[c.turn]}`).join(", ")+".";
    const ctx=ru?(main?G.ctxMain:G.ctxEq):(main?"Ristmikul on peatee ja kõrvalteed (vaata märke).":"Samaliigiliste teede ristmik, märke ega foori pole.");
    const name=c=>c.nm[0].toUpperCase()+c.nm.slice(1);
    let q,o;
    if(n===3){ const cap=x=>x[0].toUpperCase()+x.slice(1); const corr=cap(sol.order.map(c=>c.nm).join(", ")); const perms=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]].map(p=>cap(p.map(i=>cars[i].nm).join(", ")));
      q=`${ctx} ${moves} ${ru?G.order:"Mis järjekorras sõidukid ristmiku läbivad?"}`; o=[corr,...shuffle(perms.filter(x=>x!==corr)).slice(0,3)]; }
    else{ const first=sol.order[0], second=sol.order[1], askYield=Math.random()<.5;
      q=`${ctx} ${moves} `+(askYield?(ru?G.whoYield:"Kumb peab teed andma?"):(ru?G.whoFirst:"Kumb sõidab esimesena?"));
      o=askYield?[name(second),name(first),...(ru?G.oYield:["Kumbki ei pea teed andma","Mõlemad peavad peatuma"])]:[name(first),name(second),...(ru?G.oFirst:["Mõlemad korraga","See, kes jõudis ristmikule varem"])]; }
    const src=main?LKV+"; "+LS+", eesõigus ristmikul":LS+", ristmikul sõitmine"; return {q,o,f:fig,e:sol.steps.join(" "),s:ru?trSrc(src):src};
  }
  return null;
}

орости 50 км/ч","e":"Скорость определяет знак населённого пункта, а не табличка с названием."},"572":{"n":"Конец населённого пункта","m":"Населённый пункт заканчивается: общий предел 90 км/ч, если знаки не указывают иное","e":""},"573":{"n":"Жилая зона","m":"Начинается жилая зона: максимум 20 км/ч, пешеходы могут идти по всей ширине дороги","e":"Рядом с пешеходом нужно ехать со скоростью пешехода. Парковаться можно только в отведённых местах."},"574":{"n":"Конец жилой зоны","m":"Жилая зона заканчивается: выезжающий из неё уступает дорогу остальным","e":""},"575a":{"n":"Место стоянки","m":"Место, предназначенное для стоянки","e":""},"581":{"n":"Тоннель","m":"Начинается тоннель","e":"В тоннеле запрещены разворот, движение задним ходом и остановка."},"582":{"n":"Конец тоннеля","m":"Тоннель заканчивается","e":""},"821":{"n":"Зона действия","m":"Табличка: показывает, на каком участке действует основной знак","e":""},"834":{"n":"Направление главной дороги","m":"Табличка: показывает направление главной дороги на перекрёстке (толстая линия главная)","e":"Если главная дорога поворачивает, между едущими по ней действует правило правой руки."},"351":{"n":"Ограничение максимальной скорости","m":"Скорость не должна превышать указанную на знаке","e":"Действует до знака 371, другого знака скорости или знака 376."},"371":{"n":"Конец ограничения максимальной скорости","m":"Ограничение скорости, введённое знаком 351, заканчивается","e":"Дальше действует общий предел (в населённом пункте 50, вне его 90 км/ч), если не указано иное."},"451":{"n":"Ограничение минимальной скорости","m":"Ехать нужно со скоростью не ниже указанной","e":""},"452":{"n":"Конец ограничения минимальной скорости","m":"Требование минимальной скорости заканчивается","e":""},"185":{"n":"Гололедица","m":"Дорога может быть обледенелой","e":""},"591":{"n":"Знак стоп-линии","m":"Показывает место остановки при запрещающем сигнале светофора или регулировщика","e":""}},
