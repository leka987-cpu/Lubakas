 q:{
 e1:{q:"Перекрёсток равнозначных дорог, знаков и светофора нет. Какой автомобиль проедет первым?",o:["Автомобиль 2","Автомобиль 1","Оба одновременно","Тот, кто подъехал к перекрёстку раньше"],e:"На перекрёстке равнозначных дорог водитель уступает дорогу транспорту, приближающемуся справа (правило правой руки). Для автомобиля 1 автомобиль 2 находится справа.",v:["Знаков и светофора нет. Какой автомобиль проедет перекрёсток первым?"]},
 e2:{q:"Перекрёсток равнозначных дорог. Автомобиль 1 поворачивает налево, автомобиль 2 едет прямо во встречном направлении. Кто проедет первым?",o:["Автомобиль 2","Автомобиль 1","Автомобиль 1, потому что он включил указатель поворота","Никто не должен уступать"],e:"Поворачивающий налево водитель должен уступить дорогу встречному транспорту, движущемуся прямо или направо. Указатель поворота преимущества не даёт.",v:["Знаков нет. Автомобиль 1 хочет повернуть налево, навстречу прямо едет автомобиль 2. Кто едет раньше?"]},
 e3:{q:"Главная дорога идёт с севера на юг. Автомобиль 1 выезжает со второстепенной дороги (знак «Уступите дорогу»), автомобиль 2 едет по главной. Кто проедет первым?",o:["Автомобиль 2, потому что он на главной дороге","Автомобиль 1, потому что автомобиль 2 приближается к нему слева","Оба одновременно","Автомобиль 1, потому что он подъехал раньше"],e:"Знак «Уступите дорогу» обязывает уступить дорогу движущимся по главной дороге. Правило правой руки действует только на перекрёстке равнозначных дорог.",v:["Дорога север–юг главная. Автомобиль 1 стоит перед знаком «Уступите дорогу», автомобиль 2 едет по главной. Кто проезжает раньше?"]},
 e4:{q:"Перекрёсток равнозначных дорог, все едут прямо. В каком порядке транспортные средства проедут перекрёсток?",o:["Автомобиль 3, автомобиль 1, автомобиль 2","Автомобиль 1, автомобиль 2, автомобиль 3","Автомобиль 2, автомобиль 1, автомобиль 3","Автомобиль 3, автомобиль 2, автомобиль 1"],e:"У автомобиля 3 справа никого нет, поэтому он едет первым. Затем автомобиль 1, справа от которого был автомобиль 3. Последним автомобиль 2, справа от которого автомобиль 1.",v:["К перекрёстку без знаков одновременно подъехали три автомобиля, все едут прямо. В каком порядке они проедут?"]},
 e5:{q:"Перекрёсток равнозначных дорог. Трамвай (T) едет прямо, автомобиль 1 едет прямо. Кто проедет первым?",o:["Трамвай","Автомобиль, потому что трамвай приближается к нему слева","Оба одновременно","Тот, кто подаст звуковой сигнал"],e:"На перекрёстке равнозначных дорог трамвай имеет преимущество перед безрельсовым транспортом независимо от того, с какой стороны он приближается.",v:["К перекрёстку без знаков приближаются трамвай и автомобиль. Кто едет первым?"]},
 e6:{q:"Перекрёсток равнозначных дорог. Автомобиль 1 поворачивает направо, автомобиль 2 со встречного направления поворачивает налево на ту же дорогу. Кто проедет первым?",o:["Автомобиль 1","Автомобиль 2","Оба одновременно, потому что едут в разные полосы","Автомобиль 2, потому что он с главной дороги"],e:"Поворачивающий налево автомобиль 2 должен уступить дорогу встречному транспорту, движущемуся прямо или направо.",v:["На перекрёстке без знаков автомобиль 1 поворачивает направо, а встречный автомобиль 2 налево, оба на одну дорогу. Кто едет раньше?"]},
 e7:{q:"Вы выезжаете со двора (с прилегающей территории) на дорогу. Кому вы должны уступить дорогу?",o:["Всем участникам движения на дороге, в том числе пешеходам","Только транспорту справа","Только пешеходам","Никому, если включён указатель поворота"],e:"Водитель, выезжающий на дорогу с прилегающей территории (двор, парковка, АЗС), должен уступить дорогу всем участникам движения на дороге.",v:["Вы выезжаете с парковки на дорогу. Кого вы должны пропустить?"]},
 e8:{q:"Перед перекрёстком знак STOP, на пересекаемой дороге нет ни одного транспортного средства. Что вы делаете?",o:["Останавливаюсь перед стоп-линией и затем еду дальше","Снижаю скорость и еду без остановки","Останавливаюсь, только если кто-то приближается","Подаю звуковой сигнал и еду дальше"],e:"У знака STOP нужно останавливаться всегда, даже если пересекаемая дорога пуста.",v:["Перед перекрёстком красный восьмиугольный знак STOP. Пересекаемая дорога пуста. Как вы поступите?"]},
 e9:{q:"На въезде на перекрёсток с круговым движением стоит знак «Уступите дорогу». По кругу едет автомобиль. Что вы делаете?",o:["Уступаю дорогу автомобилю на кругу","Еду первым, потому что автомобиль слева от меня","Еду, если включу правый указатель поворота","Едущий по кругу должен уступить мне"],e:"Знак «Уступите дорогу» на въезде на круговой перекрёсток обязывает уступить дорогу транспорту, движущемуся по кругу.",v:["Вы приближаетесь к круговому перекрёстку со знаком «Уступите дорогу». На кругу другой автомобиль. Как поступите?"]},
 e10:{q:"В населённом пункте от обозначенной остановки начинает движение автобус, подавая сигнал указателем поворота. Что вы должны сделать?",o:["Дать автобусу начать движение, при необходимости снизив скорость","Продолжить движение, потому что у меня преимущество","Подать звуковой сигнал","Объехать его по встречной полосе"],e:"В населённом пункте водитель должен уступить дорогу автобусу, который начинает движение от обозначенной остановки и подаёт сигнал указателем поворота.",v:["В городе автобус на остановке включил левый указатель поворота и начинает движение. Что вы делаете?"]},
 e11:{q:"Сзади к вам приближается машина с синим проблесковым маячком и специальным звуковым сигналом. Что вы делаете?",o:["Уступаю дорогу, при необходимости останавливаюсь у края дороги","Ускоряюсь, чтобы не мешать","Еду как прежде, потому что у меня зелёный","Резко торможу посреди полосы"],e:"Оперативному транспорту с синим маячком и специальным звуковым сигналом нужно уступить дорогу и при необходимости остановиться.",v:["В зеркале вы видите скорую помощь с синим маячком и сиреной. Что вы делаете?"]},
 e12:{q:"Что показывает табличка под знаком главной дороги, на которой одна линия схемы перекрёстка толще остальных?",o:["Направление главной дороги на этом перекрёстке","Маршрут объезда","Место дорожных работ","Обязательное направление для всех"],e:"Табличка «Направление главной дороги» показывает, куда главная дорога поворачивает на перекрёстке.",v:["Под знаком главной дороги табличка с перекрёстком и одной толстой линией. Что показывает эта линия?"]},
 f1:{q:"Что означает мигающий жёлтый сигнал светофора?",o:["Перекрёсток нерегулируемый, руководствуюсь знаками и правилами приоритета","Нужно остановиться, как при красном","У меня всегда преимущество","Светофор сейчас переключится на зелёный"],e:"Мигающий жёлтый предупреждает об опасности: светофор не регулирует движение, действуют знаки и правила приоритета.",v:["На перекрёстке мигает жёлтый сигнал светофора. Как проехать перекрёсток?"]},
 f2:{q:"Загорается жёлтый, но вы так близко к стоп-линии, что безопасно остановиться не сможете. Что вы делаете?",o:["Могу продолжить движение","В любом случае резко торможу","Сдаю назад за стоп-линию","Останавливаюсь посреди перекрёстка"],e:"Жёлтый сигнал запрещает движение, кроме случая, когда водитель уже не может безопасно остановиться.",v:["Зелёный сменяется жёлтым, когда вы у самой стоп-линии и резкое торможение было бы опасным. Что делаете?"]},
 f3:{q:"Зелёный сигнал светофора начинает мигать. Что это значит?",o:["Зелёный скоро закончится и загорится жёлтый","Нужно немедленно остановиться","Светофор неисправен","Можно повернуть и по красной стрелке"],e:"Мигающий зелёный сообщает, что время разрешающего сигнала скоро закончится.",v:["Зелёный сигнал светофора мигает. О чём он сообщает?"]},
 f4:{q:"Горят одновременно красный и жёлтый. Что это значит?",o:["Скоро загорится зелёный, но двигаться ещё нельзя","Можно начинать движение","Светофор выключен","Нужно быстро покинуть перекрёсток"],e:"Красный вместе с жёлтым сообщают о скором включении зелёного. Движение по-прежнему запрещено.",v:["Рядом с красным загорается и жёлтый. Что это означает?"]},
 f5:{q:"Горит красный, а в дополнительной секции горит зелёная стрелка направо. Что вы можете сделать?",o:["Повернуть направо, уступив дорогу движущимся с других направлений и пешеходам","Ехать прямо","Повернуть направо, потому что у меня преимущество перед всеми","Ничего, потому что горит красный"],e:"Зелёная стрелка в дополнительной секции разрешает движение в направлении стрелки, но водитель должен уступить дорогу движущимся с других направлений.",v:["Горит красный, но в дополнительной секции загорается зелёная стрелка направо. Как поступите?"]},
 f6:{q:"Регулировщик поднимает руку вверх. Что это значит?",o:["Движение запрещено всем (кроме тех, кто не может безопасно остановиться)","Все могут двигаться","Двигаться могут только пешеходы","Можно ехать только прямо"],e:"Поднятая вверх рука запрещает движение всем участникам, как жёлтый сигнал светофора.",v:["Регулировщик держит руку поднятой. Что это значит для участников движения?"]},
 f7:{q:"Регулировщик стоит к вам боком, руки опущены или вытянуты в стороны. Что вам разрешено?",o:["Ехать прямо и направо","Только поворачивать налево","Не двигаться","Развернуться"],e:"Если регулировщик стоит к участнику движения боком (руки в стороны или опущены), он разрешает ехать прямо и направо. Пешеходы могут переходить за его спиной и перед грудью.",v:["Регулировщик стоит к вам боком, руки опущены. Куда вам можно ехать?"]},
 f8:{q:"На перекрёстке работает светофор, а регулировщик подаёт противоположные сигналы. Чему вы подчиняетесь?",o:["Регулировщику","Светофору","Дорожным знакам","Правилу правой руки"],e:"Сигналы регулировщика имеют приоритет над светофором, знаками и разметкой.",v:["Светофор разрешает ехать, а регулировщик запрещает. Кого слушаете?"]},
 f9:{q:"На перекрёстке знак «Уступите дорогу», но светофор показывает вам зелёный. Чему вы следуете?",o:["Светофору","Знаку","Обоим: должен остановиться","Ни одному, действует правило правой руки"],e:"Сигнал светофора имеет приоритет над знаками приоритета. Знаки действуют, если светофор выключен или мигает жёлтым.",v:["Вам горит зелёный, но на вашем направлении есть и знак «Уступите дорогу». По чему вы едете?"]},
 f10:{q:"Горит зелёный, вы поворачиваете налево. Навстречу прямо едет автомобиль. Кто уступает дорогу?",o:["Я","Встречный автомобиль","Никто, зелёный разрешает всем","Тот, кто медленнее"],e:"И при зелёном сигнале поворачивающий налево должен уступить дорогу встречным, едущим прямо и направо.",v:["У вас зелёный, вы хотите повернуть налево. Навстречу прямо едет другой автомобиль. Кто должен уступить?"]},
 k1:{q:"Какова максимальная разрешённая скорость в населённом пункте, если знаки не указывают иное?",o:["50 км/ч","40 км/ч","60 км/ч","70 км/ч"],e:"На дороге в населённом пункте максимальная разрешённая скорость 50 км/ч.",v:["Вы едете по городу, знаков ограничения скорости нет. С какой максимальной скоростью можно ехать?"]},
 k2:{q:"Какова максимальная разрешённая скорость вне населённого пункта, если знаки не указывают иное?",o:["90 км/ч","100 км/ч","110 км/ч","80 км/ч"],e:"Вне населённого пункта максимальная разрешённая скорость 90 км/ч. Знаком Транспортный департамент может её повысить в зависимости от условий.",v:["Вы едете по шоссе вне населённого пункта, знака ограничения нет. Какова максимальная скорость?"]},
 k3:{q:"Какова максимальная разрешённая скорость в жилой зоне?",o:["20 км/ч","10 км/ч","30 км/ч","Всегда скорость пешехода"],e:"В жилой зоне максимальная скорость 20 км/ч. Рядом с пешеходом можно ехать только со скоростью пешехода.",v:["Вы едете по жилой зоне. Какова ваша максимальная разрешённая скорость?"]},
 k4:{q:"Какова максимальная разрешённая скорость при буксировке другого транспортного средства?",o:["50 км/ч","30 км/ч","70 км/ч","90 км/ч"],e:"При буксировке максимальная разрешённая скорость 50 км/ч.",v:["Вы буксируете неисправный автомобиль. С какой скоростью можно ехать?"]},
 k5:{q:"Может ли в населённом пункте знак разрешать скорость выше 50 км/ч?",o:["Да, до 90 км/ч","Нет, в населённом пункте всегда до 50 км/ч","Да, до 120 км/ч","Только ночью"],e:"Местное самоуправление может в зависимости от условий повысить максимальную скорость в населённом пункте до 90 км/ч.",v:["Может ли в городе знаком быть установлено ограничение выше 50 км/ч?"]},
 k6:{q:"Какую наибольшую скорость Транспортный департамент может разрешить знаком вне населённого пункта?",o:["120 км/ч","110 км/ч","130 км/ч","100 км/ч"],e:"Вне населённого пункта максимальную скорость можно повысить до 120 км/ч. Летом на многих шоссе действует 100 или 110 км/ч, зимой ниже.",v:["Какую максимальную скорость можно разрешить знаком вне населённого пункта?"]},
 k7:{q:"Знак разрешает 90 км/ч, но густой туман и плохая видимость. С какой скоростью вы едете?",o:["Так, чтобы успеть остановиться в пределах видимого участка дороги","90 км/ч, раз знак разрешает","Не менее 70 км/ч, чтобы не мешать движению","90 км/ч с аварийной сигнализацией"],e:"Водитель должен выбирать скорость по видимости, состоянию дороги и движению. Ограничение скорости — верхний предел, а не рекомендация.",v:["Идёт сильный снег, видимость плохая, а знак разрешает 90 км/ч. Как вы выбираете скорость?"]},
 k8:{q:"Из чего состоит остановочный путь?",o:["Из пути за время реакции и тормозного пути","Только из тормозного пути","Из тормозного пути и дистанции","Из времени реакции и дистанции"],e:"Остановочный путь — расстояние от момента, когда водитель заметил опасность, до полной остановки: путь за время реакции плюс тормозной путь.",v:["Остановочный путь — сумма двух частей. Каких?"]},
 k9:{q:"Как изменится тормозной путь, если скорость увеличится вдвое (например, 40 → 80 км/ч)?",o:["Примерно в четыре раза длиннее","В два раза длиннее","Останется тем же","Вдвое короче"],e:"Тормозной путь растёт примерно пропорционально квадрату скорости: вдвое большая скорость даёт примерно вчетверо более длинный тормозной путь."},
 k10:{q:"Какой должна быть дистанция до движущегося впереди транспорта?",o:["Такой, чтобы при резком торможении впереди идущего я успел остановиться без столкновения","Ровно 10 метров","Длина одного автомобиля","Дистанция не важна, если тормоза исправны"],e:"Закон требует дистанцию, позволяющую избежать столкновения. Практическое правило на сухой дороге — не менее 2 секунд, на скользкой дистанцию нужно увеличить в несколько раз.",v:["Какую дистанцию нужно держать до впереди идущего автомобиля?"]},
 k11:{q:"Какова рекомендуемая минимальная дистанция на сухой дороге, если измерять её во времени?",o:["Около 2 секунд","Около 0,5 секунды","Около 10 секунд","Около 1 минуты"],e:"Правило двух секунд: когда впереди идущий проезжает какую-то точку, вы должны доехать до неё примерно через 2 секунды. На мокрой и скользкой дороге оставляйте больше.",v:["Сколько секунд на сухой дороге должно быть как минимум между вами и впереди идущим?"]},
 k12:{q:"Какова максимальная разрешённая скорость мопеда?",o:["45 км/ч","25 км/ч","50 км/ч","60 км/ч"],e:"Максимальная разрешённая скорость мопеда 45 км/ч.",v:["С какой скоростью можно ехать на мопеде?"]},
 m1:{q:"С какой стороны, как правило, разрешено обгонять?",o:["Слева","Справа","С обеих сторон","Справа, если дорога широкая"],e:"Обгон выполняется слева. Справа можно обгонять транспорт, водитель которого подал сигнал левого поворота и занял положение для поворота налево.",v:["С какой стороны обычно выполняется обгон?"]},
 m2:{q:"Вас обгоняет другое транспортное средство. Чего вам делать нельзя?",o:["Увеличивать скорость или иным образом мешать обгону","Держаться своей полосы","Ехать с прежней скоростью","Смотреть в зеркало"],e:"Водитель, которого обгоняют, не должен увеличивать скорость или иным образом препятствовать обгону.",v:["Другой автомобиль начинает вас обгонять. Чего делать нельзя?"]},
 m3:{q:"Где обгон запрещён?",o:["На железнодорожном переезде","На длинном прямом участке вне населённого пункта","На двусторонней дороге с хорошей видимостью","На автомагистрали"],e:"На железнодорожном переезде обгон запрещён. Запрещён он и, например, на нерегулируемом пешеходном переходе и в местах с плохой видимостью.",v:["В каком месте запрещён обгон другого транспортного средства?"]},
 m4:{q:"Даёт ли включённый указатель поворота вам преимущество?",o:["Нет, он только сообщает другим о намерении","Да, всегда","Да, если включить его минимум на 3 секунды","Только на круговом перекрёстке"],e:"Указатель поворота нужно включать заблаговременно до манёвра, но преимущества он не даёт.",v:["Вы включили указатель поворота. Даёт ли это вам преимущество перед другими?"]},
 m5:{q:"Где запрещён разворот?",o:["На железнодорожном переезде","На широкой улице в городе","На перекрёстке равнозначных дорог","На парковке"],e:"Разворот запрещён, в частности, на железнодорожном переезде, в тоннеле и в местах с ограниченной видимостью.",v:["В каком месте нельзя разворачиваться?"]},
 m6:{q:"Вы перестраиваетесь в соседнюю полосу. По ней в том же направлении едет другой автомобиль. Кто уступает дорогу?",o:["Я, перестраивающийся","Едущий по соседней полосе","Тот, кто медленнее","Никто, ведь я подал сигнал"],e:"Перестраивающийся должен уступить дорогу транспорту, движущемуся в том же направлении по соседней полосе.",v:["Вы меняете полосу. В соседней полосе в том же направлении едет другой автомобиль. Кто должен уступить?"]},
 m7:{q:"Два автомобиля одновременно перестраиваются навстречу друг другу в одну полосу. Кто уступает дорогу?",o:["Левый уступает правому","Правый уступает левому","Уступает тот, кто медленнее","Уступает более крупный автомобиль"],e:"При одновременном перестроении водитель слева уступает дорогу водителю справа.",v:["Два автомобиля в соседних полосах одновременно перестраиваются друг к другу. Кто уступает?"]},
 m8:{q:"На железнодорожном переезде опускается шлагбаум и мигают красные огни. Что вы делаете?",o:["Останавливаюсь и не въезжаю на переезд","Быстро проезжаю, пока шлагбаум не закрылся","Проезжаю, если поезда не видно","Объезжаю шлагбаум по встречной полосе"],e:"Мигающие красные огни и опускающийся или закрытый шлагбаум запрещают въезд на переезд.",v:["На переезде мигают красные огни и начинает опускаться шлагбаум. Как поступите?"]},
 m9:{q:"Что нужно сделать перед поворотом направо?",o:["Заранее занять положение у правого края дороги и включить указатель поворота","Занять середину дороги","Включить указатель только во время поворота","Ускориться, чтобы быстрее закончить поворот"],e:"Перед поворотом направо водитель заранее занимает положение у правого края проезжей части и подаёт сигнал указателем поворота.",v:["Вы собираетесь повернуть направо. Как к этому подготовиться?"]},
 m10:{q:"Что запрещено на автомагистрали?",o:["Разворот и движение задним ходом","Езда по левой полосе для обгона","Езда со скоростью 90 км/ч","Использование указателя поворота"],e:"На автомагистрали запрещены разворот, движение задним ходом и въезд в разрывы разделительной полосы.",v:["Чего нельзя делать на автомагистрали?"]},
 m11:{q:"Вы сдаёте назад и плохо видите, что за автомобилем. Что следует сделать?",o:["Убедиться в безопасности, при необходимости воспользоваться помощью другого человека","Быстро сдать назад, чтобы не мешать долго","Положиться только на звуковой сигнал","Сдавать назад с аварийной сигнализацией"],e:"Двигаясь задним ходом, водитель должен убедиться в безопасности и при необходимости воспользоваться помощью другого человека.",v:["Вы сдаёте назад, видимость сзади плохая. Как поступите?"]},
 p1:{q:"Чем отличаются знаки «Остановка запрещена» и «Стоянка запрещена»?",o:["При запрете стоянки можно ненадолго остановиться, при запрете остановки — нет","Ничем","Запрет остановки действует только ночью","Запрет стоянки действует только для грузовиков"],e:"Запрет остановки (крест) запрещает и кратковременную остановку. Запрет стоянки (одна полоса) разрешает остановиться, например, для посадки и высадки пассажиров.",v:["Чем знак «Стоянка запрещена» отличается от знака «Остановка запрещена»?"]},
 p2:{q:"Насколько близко к пешеходному переходу можно остановиться перед ним?",o:["Не ближе 5 м","Не ближе 1 м","Прямо перед переходом","Не ближе 50 м"],e:"Остановка запрещена на пешеходном переходе и ближе 5 м перед ним, чтобы стоящий автомобиль не закрывал пешеходов.",v:["За сколько метров до пешеходного перехода запрещена остановка?"]},
 p3:{q:"Где остановка запрещена?",o:["На железнодорожном переезде","На парковке","На обочине, если знак разрешает","У правого края дороги в населённом пункте"],e:"Остановка запрещена, в частности, на железнодорожном переезде, в тоннеле и на пешеходном переходе.",v:["В каком месте нельзя останавливаться?"]},
 p4:{q:"В населённом пункте на улице с односторонней проезжей частью вы хотите остановиться. У какого края можно?",o:["У правого или левого края","Только у правого края","Только у левого края","Только посередине проезжей части"],e:"Обычно останавливаются у правого края, но в населённом пункте на дороге с односторонней проезжей частью можно остановиться и у левого края.",v:["В городе улица с односторонним движением. Где можно остановиться?"]},
 p5:{q:"Вы выходите из стоящего автомобиля через левую дверь. Что вы должны сделать?",o:["Убедиться, что открывание двери не создаёт опасности, например велосипедисту","Быстро открыть дверь, чтобы не мешать движению","Подать звуковой сигнал","Ничего особенного"],e:"Дверь автомобиля можно открывать, только если это не создаёт опасности и помех другим участникам движения.",v:["Вы открываете дверь водителя припаркованного автомобиля со стороны дороги. Что нужно сделать?"]},
 p6:{q:"Что нужно сделать, прежде чем оставить автомобиль и уйти?",o:["Включить стояночный тормоз и принять меры, чтобы автомобиль не начал двигаться сам","Оставить двигатель работать","Оставить без стояночного тормоза на передаче","Включить дальний свет"],e:"Перед тем как покинуть автомобиль, водитель должен сделать так, чтобы он не мог самопроизвольно двинуться и им не мог воспользоваться посторонний.",v:["Вы оставляете автомобиль на улице и уходите. Что нужно сделать заранее?"]},
 p7:{q:"Насколько близко к перекрёстку можно остановиться?",o:["Не ближе 5 м от края пересекаемой проезжей части","Прямо на перекрёстке, если включена аварийная сигнализация","Не ближе 1 м","На любом расстоянии"],e:"Остановка запрещена на перекрёстке и ближе 5 м от края пересекаемой проезжей части.",v:["На каком расстоянии от края пересекаемой проезжей части нужно остановиться?"]},
 j1:{q:"На нерегулируемый пешеходный переход вступает пешеход. Что вы делаете?",o:["Уступаю дорогу пешеходу","Еду дальше, раз я уже близко","Сигналю и еду","Уступаю только ребёнку"],e:"Водитель обязан уступить дорогу пешеходу, который находится на переходе или вступает на него.",v:["Пешеход вступает на нерегулируемый переход. Как вы поступите?"]},
 j2:{q:"Автомобиль в соседней полосе остановился перед пешеходным переходом. Что вы должны сделать?",o:["Остановиться или снизить скорость и продолжить, только убедившись, что на переходе нет пешехода","Быстро объехать","Объехать, ведь уступает тот, кто стоит","Подать звуковой сигнал"],e:"Остановившийся автомобиль может закрывать пешехода. Продолжать движение можно, только убедившись, что на переходе нет пешеходов.",v:["Автомобиль в соседней полосе остановился перед переходом. Что вы делаете?"]},
 j3:{q:"Пешеход переходит дорогу в месте перехода без разметки, вы едете прямо. У кого преимущество?",o:["У водителя","У пешехода","У того, кто справа","У обоих"],e:"В месте перехода без разметки у пешехода нет преимущества перед водителем. Исключение: если водитель поворачивает на дорогу, которую переходит пешеход, он должен уступить.",v:["Пешеход переходит дорогу там, где нет пешеходного перехода, а вы едете прямо. У кого преимущество?"]},
 j4:{q:"Вы поворачиваете направо, а пересекаемую дорогу, на которую вы поворачиваете, переходит пешеход. Что вы делаете?",o:["Уступаю дорогу пешеходу","Проезжаю раньше пешехода","Сигналю","Объезжаю пешехода широкой дугой"],e:"При повороте водитель должен уступить дорогу пешеходу, переходящему проезжую часть, на которую он поворачивает.",v:["Вы поворачиваете направо на перекрёстке. Дорогу, куда вы поворачиваете, переходит пешеход. Что делаете?"]},
 j5:{q:"Вы поворачиваете направо через велосипедную дорожку, по которой прямо едет велосипедист. Кто уступает дорогу?",o:["Я","Велосипедист","Тот, кто медленнее","Никто"],e:"Поворачивающий водитель должен уступить дорогу велосипедисту, едущему прямо по велодорожке.",v:["Поворачивая направо, вы пересекаете велодорожку, по которой прямо едет велосипедист. Кто уступает?"]},
 j6:{q:"По дороге идёт пешеход с белой тростью. Что это означает?",o:["Это человек с нарушением зрения, нужно быть особенно осторожным и уступить ему дорогу","Это регулировщик","Это дорожный рабочий","Ничего особенного"],e:"Белая трость обозначает человека с нарушением зрения. Водитель должен быть особенно внимателен и уступить ему дорогу.",v:["У дороги стоит человек с белой тростью. Что это значит?"]},
 j7:{q:"Почему пешеходу в тёмное время суток нужен светоотражатель?",o:["В свете ближних фар пешехода со светоотражателем видно гораздо дальше","Светоотражатель нужен только детям","Светоотражатель заменяет пешеходный переход","Светоотражатель даёт пешеходу преимущество"],e:"Тёмно одетого пешехода без светоотражателя водитель замечает в свете ближних фар только очень близко. Со светоотражателем — в несколько раз дальше.",v:["Почему пешеходу в темноте важен светоотражатель?"]},
 j8:{q:"В жилой зоне пешеход идёт посередине дороги. Что вы делаете?",o:["Еду со скоростью пешехода и готов остановиться","Сигналю, чтобы он ушёл на тротуар","Объезжаю его на 20 км/ч","Еду обратно"],e:"В жилой зоне пешеход может идти по всей ширине дороги. Рядом с пешеходом можно ехать только со скоростью пешехода.",v:["В жилой зоне пешеход идёт посередине проезжей части. Как вы поступите?"]},
 j9:{q:"Вы приближаетесь к стоящему автобусу, из которого выходят дети. Что вы делаете?",o:["Снижаю скорость и готов остановиться","Сигналю и проезжаю мимо","Быстро проезжаю мимо","Еду с прежней скоростью"],e:"Дети могут неожиданно выбежать на дорогу из-за автобуса. Снизьте скорость и будьте готовы остановиться.",v:["Из остановившегося автобуса выходят дети. Как вы проедете мимо?"]},
 o1:{q:"С какого содержания алкоголя водитель механического транспортного средства считается находящимся в состоянии опьянения?",o:["0,20 промилле в крови или 0,10 мг/л в выдыхаемом воздухе","0,50 промилле в крови","1,5 промилле в крови","Любой запах алкоголя"],e:"Водитель механического транспортного средства находится в состоянии опьянения, если в его крови 0,20 промилле алкоголя или больше либо в выдыхаемом воздухе 0,10 мг/л или больше. Надёжнее всего не пить совсем.",v:["Какое содержание алкоголя означает состояние опьянения водителя?"]},
 o2:{q:"Вечером вы пили алкоголь. Что ускоряет его выведение из организма?",o:["Только время, ничего другое не ускоряет","Крепкий кофе","Холодный душ","Двухчасовой сон"],e:"Алкоголь расщепляется в организме равномерно, ускорить это нельзя. Утром в крови может оставаться остаточный алкоголь.",v:["Как быстрее вывести выпитый алкоголь из организма?"]},
 o3:{q:"Во время езды вы чувствуете усталость и зеваете. Что вы делаете?",o:["Останавливаюсь в безопасном месте и отдыхаю","Открываю окно и еду дальше","Делаю музыку громче","Еду быстрее, чтобы скорее доехать"],e:"Усталость замедляет реакцию, как алкоголь. Единственное эффективное средство — остановиться и отдохнуть.",v:["Во время езды клонит в сон. Что вы делаете?"]},
 o4:{q:"Можно ли во время езды разговаривать, держа телефон в руке?",o:["Нет, телефоном в руке пользоваться нельзя","Да, если разговор короткий","Да, только в населённом пункте","Да, в пробке"],e:"Во время движения запрещено пользоваться телефоном, который держат в руке. Устройство громкой связи тоже отвлекает внимание.",v:["Можно ли за рулём держать телефон в руке и разговаривать?"]},
 o5:{q:"Кто в легковом автомобиле должен пристёгиваться ремнём безопасности?",o:["Все пассажиры, в том числе на заднем сиденье","Только водитель","Водитель и пассажир спереди","Только вне населённого пункта"],e:"Ремень безопасности должен быть пристёгнут у всех, кто едет в автомобиле, и спереди, и сзади.",v:["Кому нужно пристёгиваться ремнём безопасности в легковом автомобиле?"]},
 o6:{q:"Можно ли устанавливать детское автокресло спинкой вперёд (ребёнок лицом назад) на переднее сиденье с включённой подушкой безопасности?",o:["Нет","Да","Да, если ребёнку больше года","Да, в коротких поездках"],e:"Раскрывающаяся подушка безопасности может тяжело травмировать ребёнка. Кресло, в котором ребёнок сидит спиной вперёд, нельзя ставить на сиденье с включённой подушкой.",v:["Ребёнок сидит в кресле спиной по ходу движения. Можно ли ставить кресло на переднее сиденье с включённой подушкой?"]},
 o7:{q:"Можно ли везти маленького ребёнка в автомобиле на руках?",o:["Нет, ребёнок должен быть пристёгнут удерживающим устройством по росту и весу","Да, если поездка короткая","Да, на заднем сиденье","Да, если взрослый пристёгнут"],e:"Ребёнка нужно пристегнуть удерживающим устройством, подходящим по росту и весу. При столкновении никто не удержит ребёнка на руках.",v:["Можно ли в короткой поездке взять маленького ребёнка на руки?"]},
 o8:{q:"На мокрой дороге начинается аквапланирование (шины теряют сцепление). Что вы делаете?",o:["Отпускаю педаль газа и держу руль прямо, резко не торможу","Тормозу изо всех сил","Резко поворачиваю руль","Добавляю газ"],e:"При аквапланировании отпустите газ и держите руль прямо, пока шины снова не получат контакт с дорогой.",v:["На мокрой дороге шины теряют сцепление и автомобиль скользит по воде. Что делаете?"]},
 o9:{q:"Как тормозить в экстренной ситуации на автомобиле с ABS?",o:["Нажимаю на тормоз изо всех сил и держу","Нажимаю на тормоз прерывисто","Торможу только стояночным тормозом","Выключаю двигатель"],e:"ABS не даёт колёсам заблокироваться и сохраняет управляемость. Тормоз нужно нажать изо всех сил и держать.",v:["У вашего автомобиля есть ABS. Как пользоваться тормозом при экстренном торможении?"]},
 o10:{q:"Вас ослепляют фары встречного автомобиля. Что вы делаете?",o:["Снижаю скорость и смотрю на правый край дороги","Включаю свой дальний свет","На мгновение закрываю глаза","Ускоряюсь"],e:"При ослеплении снизьте скорость, при необходимости остановитесь, и смотрите на правый край дороги. Ослеплять в ответ дальним светом опасно и запрещено.",v:["Фары встречного автомобиля ослепляют. Как поступите?"]},
 o11:{q:"Как проезжать крутой поворот?",o:["Снижаю скорость до поворота, в повороте держу ровную скорость","Торможу в середине поворота","Ускоряюсь при входе в поворот","Срезаю поворот по встречной полосе"],e:"Торможение в повороте может вызвать занос. Скорость нужно снизить до поворота.",v:["Как безопасно проехать крутой поворот?"]},
 o12:{q:"Как должна измениться дистанция на скользкой дороге?",o:["Увеличиться в несколько раз","Остаться прежней","Уменьшиться","На скользкой дороге дистанция не важна"],e:"На скользкой дороге тормозной путь в несколько раз длиннее. Настолько же нужно увеличить и дистанцию.",v:["Дорога обледенела. Что должно произойти с дистанцией?"]},
 o13:{q:"Вы принимаете лекарство, в инструкции к которому есть предупреждение о вождении. Что вы делаете?",o:["Не сажусь за руль, если лекарство может влиять на способность управлять","Езжу, ведь лекарство из аптеки","Езжу только днём","Езжу медленнее"],e:"Некоторые лекарства замедляют реакцию или вызывают сонливость. В таком состоянии управлять автомобилем запрещено.",v:["В инструкции к лекарству предупреждение, что оно может влиять на вождение. Как поступите?"]},
 o14:{q:"В сумерках на дорогу выходит лось. Что вы делаете?",o:["Энергично торможу и учитываю, что животное может двигаться неожиданно","Ускоряюсь, чтобы проехать раньше животного","Сигналю и еду с той же скоростью","Выключаю фары"],e:"Лось может двигаться непредсказуемо. Энергично тормозите и избегайте резких манёвров на встречную полосу.",v:["В сумерках у края дороги появляется лось. Как вы реагируете?"]},
 o15:{q:"Что делать при езде в тумане?",o:["Использую ближний свет или противотуманные фары и снижаю скорость","Использую дальний свет","Еду близко за впереди идущим, чтобы видеть его огни","Еду с аварийной сигнализацией с обычной скоростью"],e:"В тумане дальний свет ухудшает видимость. Используйте ближний свет и противотуманные фары, снизьте скорость и увеличьте дистанцию.",v:["Густой туман. Какие фары вы включаете и как едете?"]},
 s1:{q:"Какие фары должны гореть у механического транспортного средства днём во время движения?",o:["Ближний свет или дневные ходовые огни, они должны гореть всегда","Днём фары не нужны","Только противотуманные","Только аварийная сигнализация"],e:"Во время движения у механического транспортного средства круглосуточно должны гореть ближний свет или дневные ходовые огни. В тёмное время нужно использовать ближний или дальний свет.",v:["Должны ли днём у автомобиля гореть фары?"]},
 s2:{q:"Вы едете в темноте с дальним светом, навстречу едет автомобиль. Что вы делаете?",o:["Заблаговременно переключаю дальний свет на ближний","Оставляю дальний свет","Выключаю фары","Мигаю дальним светом"],e:"Дальний свет нужно переключить на ближний, чтобы не ослеплять встречного водителя. То же правило, когда вы едете близко за другим автомобилем.",v:["Ночью на шоссе навстречу едет автомобиль, у вас дальний свет. Что делаете?"]},
 s3:{q:"Когда в Эстонии можно использовать шипованные шины (если Транспортный департамент не изменит срок из-за погоды)?",o:["С 15 октября по 31 марта","С 1 ноября по 1 апреля","С 1 декабря по 1 марта","Круглый год"],e:"Шипованные шины разрешены с 15 октября по 31 марта. Из-за погодных условий Транспортный департамент может изменить этот период.",v:["В какие даты, как правило, разрешено использовать шипованные шины?"]},
 s4:{q:"Когда зимние шины на легковом автомобиле обязательны?",o:["С 1 декабря по 1 марта","С 15 октября по 31 марта","С 1 ноября по 1 мая","Только при снеге"],e:"Зимние шины (шипованные или фрикционные) обязательны с 1 декабря по 1 марта.",v:["В какой период на легковом автомобиле должны быть зимние шины?"]},
 s5:{q:"Какой должна быть глубина рисунка протектора зимней шины как минимум?",o:["3 мм","1,6 мм","1 мм","5 мм"],e:"Глубина рисунка протектора зимней шины должна быть не менее 3 мм (у летней — не менее 1,6 мм).",v:["Какова минимальная допустимая глубина рисунка зимней шины?"]},
 s6:{q:"Что должно быть в оснащении легкового автомобиля?",o:["Знак аварийной остановки, огнетушитель и аптечка","Цепи противоскольжения","Буксировочный трос и домкрат","Запасное колесо и компрессор"],e:"Обязательное оснащение легкового автомобиля: знак аварийной остановки, огнетушитель и средства первой помощи.",v:["Что входит в обязательное оснащение легкового автомобиля?"]},
 s7:{q:"Когда нужно включить аварийную сигнализацию?",o:["Когда автомобиль остановился в месте, где он может быть опасен для других, например из-за неисправности","Когда паркуюсь в запрещённом месте","Когда медленно еду по левой полосе","Всегда в дождь"],e:"Аварийная сигнализация предупреждает других, когда автомобиль стоит в опасном месте или совершил вынужденную остановку.",v:["Когда вы используете аварийную сигнализацию?"]},
 u1:{q:"Вы подъехали к ДТП, где есть пострадавшие. Как правильно действовать?",o:["Обеспечиваю безопасность (аварийная сигнализация, знак аварийной остановки), звоню 112 и оказываю первую помощь","Фотографирую и еду дальше","Сразу вытаскиваю всех пострадавших из машины","Жду, пока позвонит кто-то другой"],e:"Сначала обезопасьте место ДТП, чтобы не произошло новой аварии, затем вызовите помощь по номеру 112 и окажите первую помощь.",v:["Вы оказались у ДТП с пострадавшими. В каком порядке действуете?"]},
 u2:{q:"По какому номеру вызывать скорую помощь, спасателей и полицию?",o:["112","110","911","1247"],e:"В Эстонии единый номер экстренной помощи 112.",v:["По какому номеру звонить, чтобы вызвать помощь при ДТП?"]},
 u3:{q:"Когда можно перемещать пострадавшего на месте ДТП?",o:["Когда пребывание на месте угрожает его жизни, например при пожаре","Всегда, чтобы ему было удобнее лежать","Никогда","Когда он просит воды"],e:"Пострадавшего нельзя перемещать без нужды, это может усугубить травмы. Исключение — прямая угроза жизни.",v:["Когда можно вынести пострадавшего с места ДТП?"]},
 u4:{q:"Пострадавший без сознания, но дышит. Как его уложить?",o:["На бок в устойчивое положение","На спину, голова выше","Посадить","На живот"],e:"Дышащего пострадавшего без сознания укладывают на бок в устойчивое положение, чтобы дыхательные пути оставались свободными.",v:["Как уложить человека без сознания, который дышит?"]},
 u5:{q:"Ваш автомобиль остановился на дороге из-за неисправности. Куда поставить знак аварийной остановки?",o:["Позади автомобиля на таком расстоянии, чтобы другие вовремя заметили опасность","Прямо рядом с автомобилем","На крышу автомобиля","Перед автомобилем"],e:"Знак аварийной остановки ставят позади автомобиля на таком расстоянии, чтобы другие участники движения вовремя его заметили и успели среагировать.",v:["Автомобиль из-за поломки остановился на дороге. Куда вы ставите знак аварийной остановки?"]},
 u6:{q:"Вы участник небольшого столкновения, никто не пострадал. Что можно сделать?",o:["Стороны могут оформить совместное извещение и убрать автомобили с дороги","Нужно сразу уехать с места ДТП","Нужно всегда ждать полицию несколько часов","Можно уехать, не оставив своих данных"],e:"Если пострадавших нет и участники согласны в обстоятельствах, они могут сами оформить ДТП и убрать автомобили, чтобы не мешать движению. Уезжать, не обменявшись данными, нельзя.",v:["Небольшое столкновение, пострадавших нет. Что могут сделать участники?"]},
 n1:{q:"На вашем направлении знак «Уступите дорогу». На пересекаемой дороге никого нет, видимость хорошая. Нужно ли останавливаться?",o:["Не нужно, могу безопасно ехать дальше","Да, всегда останавливаюсь перед стоп-линией","Да, останавливаюсь минимум на 3 секунды","Нужно подать звуковой сигнал"],e:"Знак «Уступите дорогу» не обязывает останавливаться, если уступать некому. Обязательная остановка действует у знака STOP.",v:["Перед знаком «Уступите дорогу» пересекаемая дорога пуста. Обязательна ли остановка?"]},
 n2:{q:"Вне населённого пункта от остановки начинает движение автобус. Обязаны ли вы уступить ему дорогу?",o:["Нет, эта обязанность действует в населённом пункте, но я внимателен","Да, всегда","Да, только в тёмное время суток","Нужно остановиться за автобусом"],e:"Обязанность уступить дорогу автобусу, отъезжающему от остановки, действует в населённом пункте. Вне его всё равно будьте внимательны."},
 n3:{q:"Загорается жёлтый. Вы достаточно далеко от стоп-линии, чтобы безопасно остановиться. Что вы делаете?",o:["Останавливаюсь перед стоп-линией","Ускоряюсь и проезжаю","Еду дальше, жёлтый разрешает","Поворачиваю направо"],e:"Жёлтый сигнал запрещает движение. Ехать дальше можно, только если безопасно остановиться уже нельзя.",v:["Светофор переключается на жёлтый, когда вы ещё далеко от перекрёстка. Как поступите?"]},

let store={q:{},exams:[]};
try{const raw=localStorage.getItem(KEY); if(raw) store=Object.assign(store,JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
function record(id,ok){const r=store.q[id]||{c:0,w:0};ok?r.c++:r.w++;r.last=ok?1:0;store.q[id]=r;save()}
const byId=Object.fromEntries(Q.map(q=>[q.id,q]));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function topicStats(t){const qs=Q.filter(q=>!t||q.t===t);let m=0,seen=0;for(const q of qs){const r=store.q[q.id];if(r){seen++;if(r.last)m++}}return{n:qs.length,seen,m}}
function wrongList(){return Q.filter(q=>store.q[q.id]&&!store.q[q.id].last)}

function figHtml(f){if(!f)return"";if(f.startsWith("sign:"))return`<div class="fig sign">${signSvg(f.slice(5))}</div>`;return`<div class="fig">${f}</div>`}
function prep(q){ // materialise one concrete question: generated content, wording variant, shuffled options
  let base=q;
  if(q.gen){const g=GEN[q.gen](); base=g?{...q,...g}:prep(Q.find(x=>x.id==="e1")).q}
  let text=base.q;
  if(CH) text=pick([base.q,...(base.v||[])]); // friend challenge: same wording for both players
  else if(store.q[q.id]&&base.v&&base.v.length) text=pick(base.v); // seen before: comes back reworded
  const opts=q.sign?signOptions(q.sign):q.rsign?reverseSignOptions(q.rsign):base.o.slice();
  const order=shuffle(opts.map((_,i)=>i));
  return {q:{...base,q:text},opts:order.map(i=>opts[i]),correct:order.indexOf(0),pick:null};
}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  </section>`;
  document.getElementById("back").onclick=home;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answerP(+b.dataset.i));
  window.scrollTo(0,0);
}
function answerP(i){
  const it=P.list[P.i], ok=i===it.correct; it.pick=i;
  record(it.q.id,ok); track(it.q,ok); checkAwards(); if(ok)P.right++;
  app.querySelectorAll(".opt").forEach((b,j)=>{b.classList.add("locked");if(j===it.correct)b.classList.add("right");else if(j===i)b.classList.add("wrong")});
  const last=P.i===P.list.length-1;
  document.getElementById("fb").innerHTML=`
   <div class="explain ${ok?"":"bad"}"><b>${ok?T.right:T.wrongAns(LET[it.correct])}</b><p class="quip">${esc(quip(ok))}</p><p>${esc(it.q.e)}</p><p class="src">${esc(it.q.s)}</p></div>
   <div class="row" style="margin-top:14px"><button class="btn" id="next">${last?T.result:T.next}</button></div>`;
  const nx=document.getElementById("next"); nx.focus({preventScroll:true});
  nx.onclick=()=>{ if(last) practiceDone(); else {P.i++;showP()} };
  document.getElementById("fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function practiceDone(){
  const n=P.list.length, wrong=P.list.filter(x=>x.pick!==x.correct), mode=P.mode;
  app.innerHTML=`
  <section class="card" style="display:flex;flex-direction:column;gap:14px">
    <span class="eyebrow">${esc(modeTitle(mode))} · ${T.resultT}</span>
    <div class="big mono">${P.right} / ${n}</div>
    <p>${P.right===n?T.allRight:T.someWrong(wrong.length)}</p>
    <div class="row"><button class="btn" id="again">${T.again}</button><button class="btn ghost" id="home">${T.homeBtn}</button></div>
  </section>`;
  document.getElementById("again").onclick=()=>mode.redo?(wrongList().length?practice(wrongList(),mode,true):home()):practice(mode.mix?Q:Q.filter(q=>q.t===mode.topic),mode);
  document.getElementById("home").onclick=home;
  window.scrollTo(0,0);
}

/* ---- Exam ---- */
const EXAM={n:40,safety:10,minutes:30,maxWrong:5,maxSafetyWrong:1};
let E=null,timerId=null;
function examIntro(){
  app.innerHTML=`
  <section class="card" style="display:flex;flex-direction:column;gap:14px">
    <span class="eyebrow">${T.exam}</span>
    <h2 style="font-size:28px">${T.examLike}</h2>
    <ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">
      <li>${T.li1(EXAM.n)}</li><li>${T.li2(EXAM.minutes)}</li><li>${T.li3(EXAM.maxWrong,EXAM.maxSafetyWrong)}</li><li>${T.li4}</li>
    </ul>
    <p class="note">${T.examNote}</p>
    <div class="row"><button class="btn" id="start">${T.start}</button><button class="btn ghost" id="home">${T.back}</button></div>
  </section>`;
  document.getElementById("start").onclick=()=>startExam();
  document.getElementById("home").onclick=home;
}
function startExam(seed,friend){
  if(seed==null) seed=Math.floor(Math.random()*60466176);
  const list=withSeed(seed,()=>{
  const safe=shuffle(Q.filter(q=>q.safe)).slice(0,EXAM.safety);
  const rest=Q.filter(q=>!q.safe);
  const signs=shuffle(rest.filter(q=>q.t==="margid")).slice(0,8);
  const others=shuffle(rest.filter(q=>q.t!=="margid")).slice(0,EXAM.n-safe.length-signs.length);
  return shuffle([...safe,...signs,...others]).map(prep); });
  E={list,i:0,end:Date.now()+EXAM.minutes*60000,done:false,seed,friend};
  timerId=setInterval(tick,1000);
  showE();
}
function tick(){
  const left=Math.max(0,E.end-Date.now()), el=document.getElementById("clock");
  if(el){el.textContent=fmt(left);el.classList.toggle("low",left<5*60000)}
  if(left<=0) finishExam();
}
const fmt=ms=>{const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function showE(){
  const it=E.list[E.i], q=it.q, n=E.list.length, answered=E.list.filter(x=>x.pick!==null).length;
  app.innerHTML=`
  <div class="hud"><span class="eyebrow">${T.examAns(answered,n)}</span><span class="clock" id="clock">${fmt(E.end-Date.now())}</span></div>
  <div class="dots">${E.list.map((x,j)=>`<button class="dot ${x.pick!==null?"ans":""} ${j===E.i?"cur":""}" data-j="${j}" aria-label="${T.qn(j+1)}">${j+1}</button>`).join("")}</div>
  <section class="card q">
    <div class="row"><span class="eyebrow">${T.qn(E.i+1)}</span>${q.safe?`<span class="tag safe">${T.safety}</span>`:""}</div>
    <h2>${esc(q.q)}</h2>
    ${figHtml(q.f)}
    <div class="${optsCls(it)}">${it.opts.map((o,i)=>`<button class="opt ${it.pick===i?"sel":""}" data-i="${i}"><span class="l">${LET[i]}</span><span>${optHtml(o)}</span></button>`).join("")}</div>
    <div class="row" style="justify-content:space-between">
      <button class="btn ghost" id="prev" ${E.i===0?"disabled":""}>${T.prev}</button>
      ${E.i<n-1?`<button class="btn" id="nxt">${T.next}</button>`:`<button class="btn" id="fin">${T.finish}</button>`}
    </div>
  </section>
  <div class="row"><button class="btn ghost" id="fin2" style="font-size:14px;padding:8px 14px">${T.finish}</button><button class="btn ghost" id="quit" style="font-size:14px;padding:8px 14px">${T.quit}</button></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{it.pick=+b.dataset.i; if(E.i<n-1){E.i++;} showE()});
  app.querySelectorAll(".dot").forEach(b=>b.onclick=()=>{E.i=+b.dataset.j;showE()});
  const pv=document.getElementById("prev"); if(pv) pv.onclick=()=>{E.i--;showE()};
  const nx=document.getElementById("nxt"); if(nx) nx.onclick=()=>{E.i++;showE()};
  let armed=false;
  const confirmFin=e=>{const un=n-E.list.filter(x=>x.pick!==null).length;
    if(un&&!armed){armed=true;e.target.textContent=T.unans(un);return} finishExam()};
  const f1=document.getElementById("fin"); if(f1) f1.onclick=confirmFin;
  document.getElementById("fin2").onclick=confirmFin;
  let qa=false; document.getElementById("quit").onclick=e=>{if(!qa){qa=true;e.target.textContent=T.quitSure;return}clearInterval(timerId);home()};
}
function finishExam(){
  if(E.done) return; E.done=true; clearInterval(timerId);
  let wrong=0,sw=0;
  for(const x of E.list){const ok=x.pick===x.correct;record(x.q.id,ok);track(x.q,ok);if(!ok){wrong++;if(x.q.safe)sw++}}
  const score=E.list.length-wrong, pass=wrong<=EXAM.maxWrong&&sw<=EXAM.maxSafetyWrong;
  store.exams.push({d:Date.now(),score,wrong,sw,pass}); const st=stats(); if(pass)st.passes++; if(!wrong)st.clean++; if(E.friend!=null)st.challenges++; save(); checkAwards();
  const code=`LUBA-${encSeed(E.seed)}-${score}`, title=titleFor(score), shareText=F().shareT(score,E.list.length,pass,title,code);
  const reason=pass?T.passed:(sw>EXAM.maxSafetyWrong?T.safeFail(sw,EXAM.maxSafetyWrong):T.totFail(wrong,EXAM.maxWrong));
  app.innerHTML=`
  <section class="card" style="display:flex;flex-direction:column;gap:14px">
    <span class="eyebrow">${T.examRes}</span>
    <div class="row"><div class="big mono">${score} / ${E.list.length}</div><span class="verdict ${pass?"ok":"bad"}">${pass?T.PASS:T.FAIL}</span></div>
    <p>${esc(reason)}. ${T.sum(wrong,sw)}</p>
    <p class="titleline"><span class="eyebrow">${F().yourTitle}</span><b>${esc(title)}</b></p>
    ${E.friend!=null?`<p class="vs">${esc(F().vs(score,E.friend))}</p>`:""}
    ${sharePanel(shareText)}
    <div class="dots">${E.list.map((x,j)=>`<span class="dot ${x.pick===x.correct?"r":"w"}">${j+1}</span>`).join("")}</div>
    <div class="row"><button class="btn" id="again">${T.newExam}</button><button class="btn ghost" id="home">${T.homeBtn}</button></div>
  </section>
  ${wrong?`<section class="card review"><h2 style="font-size:22px">${T.review}</h2>${E.list.map((x,j)=>x.pick===x.correct?"":`
    <div class="rv"><span class="eyebrow">${T.qn(j+1)}${x.q.safe?T.safeTag:""}</span><b>${esc(x.q.q)}</b>${figHtml(x.q.f)}
    <span class="a" style="color:var(--bad)">${T.your}${x.pick===null?T.none:esc(optText(x.opts[x.pick]))}</span>
    <span class="a" style="color:var(--ok)">${T.correctIs}${esc(optText(x.opts[x.correct]))}</span>
    <p class="a">${esc(x.q.e)}</p><p class="src">${esc(x.q.s)}</p></div>`).join("")}</section>`:""}`;
  document.getElementById("again").onclick=examIntro;
  document.getElementById("home").onclick=home;
  wireShare(shareText);
  window.scrollTo(0,0);
}

function challengeIntro(){
  app.innerHTML=`
  <section class="card" style="display:flex;flex-direction:column;gap:14px">
    <span class="eyebrow">${F().challenge}</span>
    <h2 style="font-size:26px">${F().challengeSub}</h2>
    <label for="code" class="note">${F().codePh}</label>
    <input id="code" class="codein" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="LUBA-XXXXX-00">
    <p class="note" id="codeErr" hidden>${F().badCode}</p>
    <div class="row"><button class="btn" id="go">${F().play}</button><button class="btn ghost" id="home">${T.back}</button></div>
  </section>`;
  const go=()=>{const c=parseCode(document.getElementById("code").value); if(!c){document.getElementById("codeErr").hidden=false;return} startExam(c.seed,c.score)};
  document.getElementById("go").onclick=go; document.getElementById("code").onkeydown=e=>{if(e.key==="Enter")go()};
  document.getElementById("home").onclick=home;
}

/* ---- Atlas ---- */
function atlas(){
  const groups={};for(const [id,s] of Object.entries(SIGNS)){(groups[s.g]=groups[s.g]||[]).push([id,s])}
  const order=["Hoiatusmärgid","Eesõigusmärgid","Keelumärgid","Kohustusmärgid","Teavitusmärgid"];
  app.innerHTML=`
  <div class="hud"><button class="btn ghost" id="back" style="padding:8px 14px">${T.home}</button><span class="eyebrow">${T.atlas}</span></div>
  <section class="card" style="display:flex;flex-direction:column;gap:12px">
    <h2 style="font-size:26px">${T.atlasT}</h2>
    <p class="muted">${T.atlasNote}</p>
    ${order.map(g=>`<h3 class="grp">${groupName(g)}</h3><div class="atlas">${groups[g].map(([id,s])=>`<div class="sg">${signSvg(id)}<b>${esc(s.n)}</b><small>${esc(s.m)}</small></div>`).join("")}</div>`).join("")}
    <div class="row"><button class="btn" id="quiz">${T.quiz}</button></div>
  </section>`;
  document.getElementById("back").onclick=home;
  document.getElementById("quiz").onclick=()=>practice(Q.filter(q=>q.t==="margid"),{topic:"margid"});
  window.scrollTo(0,0);
}

applyLang(LANG);
home();
syncReminder();
</script>
