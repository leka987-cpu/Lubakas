<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="fonts.css">
<title>Lubakas</title>
<style>html{-webkit-text-size-adjust:100%}*{-webkit-tap-highlight-color:transparent}body{margin:0}img{max-width:100%}[hidden]{display:none!important}@media (hover:none){.fb .note{visibility:hidden}}</style>

<body>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: same graph-paper notebook as the rest of the series; the question card is the raised object. */
:root{
  --paper:#EDF0F5; --grid:#DCE2EC; --card:#FFFFFF; --ink:#18203A; --muted:#5B6580;
  --accent:#E39B12; --accent-soft:#FBEFD6; --ok:#1F8A5B; --ok-soft:#DDF2E7; --bad:#C8412D; --bad-soft:#F8E1DC;
  --line:#C9D1DE; --road:#5E6678; --roadline:#F4F6FA; --verge:#CFE3C6;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10131C; --grid:#1A2030; --card:#181D2A; --ink:#E5E9F3; --muted:#96A0B8;
  --accent:#F2B13A; --accent-soft:#3A2E14; --ok:#3DBE85; --ok-soft:#163327; --bad:#EF6A55; --bad-soft:#3A1E1A;
  --line:#2C3448; --road:#3A4152; --roadline:#C9CFDB; --verge:#22331F; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#10131C; --grid:#1A2030; --card:#181D2A; --ink:#E5E9F3; --muted:#96A0B8;
  --accent:#F2B13A; --accent-soft:#3A2E14; --ok:#3DBE85; --ok-soft:#163327; --bad:#EF6A55; --bad-soft:#3A1E1A;
  --line:#2C3448; --road:#3A4152; --roadline:#C9CFDB; --verge:#22331F; color-scheme:dark }
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:780px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.1}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:6px;box-shadow:5px 5px 0 var(--ink);padding:22px}
.btn{background:var(--accent);color:#18203A;border:1.5px solid var(--ink);border-radius:6px;padding:12px 20px;font-weight:700;
  box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn:disabled{opacity:.45;pointer-events:none}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.hidden{display:none!important}

/* Start */
.hero{display:flex;flex-direction:column;gap:12px}
.hero h1{font-size:clamp(44px,10vw,80px);font-weight:800;letter-spacing:-.03em}
.hero h1 span{color:var(--accent)}
.hero .lead{font-size:18px;max-width:60ch}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mode{text-align:left;background:var(--card);border:1.5px solid var(--ink);border-radius:6px;padding:16px;display:flex;gap:12px;align-items:flex-start;
  box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.mode:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.mode svg{width:44px;height:44px;flex:none}
.mode b{font-family:var(--f-display);font-size:18px;display:block}
.mode small{color:var(--muted);font-size:14px;line-height:1.35;display:block;margin-top:2px}
.mode.primary{background:var(--accent-soft)}
.topics{display:flex;flex-direction:column;gap:6px}
.topic{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;background:transparent;border:1.5px dashed var(--line);border-radius:6px;padding:10px 12px}
.topic:hover{border-color:var(--ink);border-style:solid}
.topic b{font-weight:700}
.topic .pct{font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--grid);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0}
.stat .v{font-family:var(--f-mono);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.stat .k{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.note a{color:inherit}

/* Question */
.hud{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.progress{height:8px;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;background:var(--card)}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.q{display:flex;flex-direction:column;gap:16px}
.q h2{font-size:22px;font-weight:800;line-height:1.25}
.fig{display:flex;justify-content:center}
.fig svg{width:min(100%,260px);height:auto}
.fig.sign svg{width:140px}
.opts{display:flex;flex-direction:column;gap:10px}
.quip{font-style:italic;color:var(--muted)}
.streak{display:flex;gap:12px;align-items:center;border:1.5px dashed var(--ink);border-radius:6px;padding:10px 14px;background:var(--card)}
.streak b{font-size:22px}.streak small{display:block;color:var(--muted);font-size:13px}
.awards{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.aw{border:1.5px solid var(--line);border-radius:6px;padding:8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;opacity:.6}
.aw.on{opacity:1;border-color:var(--ink);background:var(--accent-soft)}
.aw svg{width:34px;height:34px}.aw b{font-size:13px;line-height:1.2}.aw small{font-size:11px;color:var(--muted);line-height:1.25}
.titleline{display:flex;flex-direction:column;gap:2px}.titleline b{font-family:var(--f-display);font-size:22px}
.vs{font-weight:700}
.share{display:flex;flex-direction:column;gap:8px;border-top:1.5px dashed var(--line);padding-top:12px}
.share textarea,.codein{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:6px;padding:10px;width:100%;resize:vertical}
.codein{font-family:var(--f-mono);font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--card);padding:10px 16px;border-radius:6px;font-weight:700;transition:all .3s;z-index:20;max-width:calc(100% - 32px)}
.toast.in{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.mode svg{width:44px;height:44px;flex:none}
.langs{display:inline-flex;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.lng{background:var(--card);border:0;padding:4px 10px;font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.08em}
.lng.on{background:var(--ink);color:var(--card)}
.opts.grid{display:grid;grid-template-columns:1fr 1fr}
.osign svg{width:72px;height:72px;display:block}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:1.5px solid var(--ink);border-radius:6px;padding:12px 14px;
  box-shadow:2px 2px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.opt:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.opt .l{font-family:var(--f-mono);font-weight:700;color:var(--muted);min-width:1.2em}
.opt.sel{background:var(--accent-soft)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.locked{pointer-events:none}
.explain{border-left:4px solid var(--ok);background:var(--ok-soft);padding:12px 14px;border-radius:0 6px 6px 0;display:flex;flex-direction:column;gap:6px}
.explain.bad{border-color:var(--bad);background:var(--bad-soft)}
.explain b{font-family:var(--f-display);font-size:18px}
.src{font-size:13px;color:var(--muted)}
.src::before{content:"§ ";font-family:var(--f-mono);font-weight:700}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:3px;padding:1px 6px;color:var(--muted)}
.tag.safe{border-color:var(--bad);color:var(--bad)}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dot{width:26px;height:26px;border:1.5px solid var(--line);border-radius:4px;background:var(--card);font-family:var(--f-mono);font-size:11px;padding:0;display:grid;place-items:center}
.dot.ans{background:var(--accent-soft);border-color:var(--ink)}
.dot.cur{outline:2px solid var(--accent);outline-offset:1px}
.dot.r{background:var(--ok-soft);border-color:var(--ok)}
.dot.w{background:var(--bad-soft);border-color:var(--bad)}
.clock{font-family:var(--f-mono);font-weight:700;font-size:20px}
.clock.low{color:var(--bad)}

/* Results */
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,9vw,64px);line-height:1}
.verdict{display:inline-block;padding:4px 12px;border:1.5px solid var(--ink);border-radius:4px;font-family:var(--f-display);font-weight:800;font-size:20px}
.verdict.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.review{display:flex;flex-direction:column;gap:12px}
.rv{border:1.5px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:6px}
.rv .a{font-size:14px}

/* Atlas */
.atlas{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.sg{border:1.5px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--card)}
.sg svg{width:72px;height:72px}
.sg b{font-family:var(--f-display);font-size:16px;line-height:1.15}
.sg small{font-size:13px;color:var(--muted);line-height:1.35}
.grp{font-family:var(--f-display);font-size:20px;margin-top:8px}
@media (max-width:480px){.card{padding:16px}.stats{grid-template-columns:1fr 1fr 1fr}.stat .v{font-size:18px}}
</style>
<main class="wrap" id="app"></main>
<script>
/* ============ SIGNS (original drawings, viewBox 0 0 100 100) ============ */
const RED="#D0202A", BLUE="#1F5FBF", YEL="#F2C230", BLK="#18203A";
const W=s=>`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${s}</svg>`;
const warn=i=>`<path d="M50 7 L95 88 H5 Z" fill="#fff" stroke="${RED}" stroke-width="8" stroke-linejoin="round"/>${i}`;
const ring=i=>`<circle cx="50" cy="50" r="44" fill="#fff" stroke="${RED}" stroke-width="10"/>${i}`;
const blueC=i=>`<circle cx="50" cy="50" r="46" fill="${BLUE}" stroke="#fff" stroke-width="2"/>${i}`;
const blueS=i=>`<rect x="5" y="5" width="90" height="90" rx="8" fill="${BLUE}" stroke="#fff" stroke-width="2"/>${i}`;
const person=(x,y,s=1,c=BLK)=>`<g transform="translate(${x} ${y}) scale(${s})" stroke="${c}" stroke-width="5" stroke-linecap="round" fill="none"><circle cx="0" cy="-22" r="5" fill="${c}" stroke="none"/><path d="M0 -15 L-2 2 M-2 2 L-9 16 M-2 2 L6 16 M0 -12 L-9 -3 M0 -12 L9 -5"/></g>`;
const car=(x,y,c,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><path d="M-14 4 V-4 Q-12 -9 -8 -10 L-5 -16 H5 L8 -10 Q12 -9 14 -4 V4 Z" fill="${c}"/><circle cx="-8" cy="5" r="4" fill="${c}"/><circle cx="8" cy="5" r="4" fill="${c}"/><rect x="-4" y="-14" width="8" height="4" fill="#fff"/></g>`;
function arcArrow(cx,cy,r,a0,a1,c="#fff",w=7){ // angles in degrees, counterclockwise on screen when a1<a0
  const p=a=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];
  const [x0,y0]=p(a0),[x1,y1]=p(a1);
  const sweep=a1>a0?1:0;
  const dir=a1>a0?1:-1, t=(a1+dir*90)*Math.PI/180, n=a1*Math.PI/180;
  const tip=[x1+9*Math.cos(t),y1+9*Math.sin(t)], b1=[x1+8*Math.cos(n),y1+8*Math.sin(n)], b2=[x1-8*Math.cos(n),y1-8*Math.sin(n)];
  return `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 ${sweep} ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${c}" stroke-width="${w}"/><path d="M${tip[0].toFixed(1)} ${tip[1].toFixed(1)} L${b1[0].toFixed(1)} ${b1[1].toFixed(1)} L${b2[0].toFixed(1)} ${b2[1].toFixed(1)}Z" fill="${c}"/>`;
}
const SIGNS={
  anna:{g:"Eesõigusmärgid",n:"Anna teed",m:"Pead andma teed ristuval teel liiklejatele",
    e:"Kolmnurk tipuga alla tähendab, et ristuval teel liiklejatel on eesõigus. Peatuma ei pea, kui teed andmata saab ohutult sõita.",
    svg:`<path d="M6 10 H94 L50 92 Z" fill="#fff" stroke="${RED}" stroke-width="8" stroke-linejoin="round"/>`},
  stop:{g:"Eesõigusmärgid",n:"STOP",m:"Pead peatuma ja andma teed ristuval teel liiklejatele",
    e:"STOP-märgi juures tuleb alati peatuda stoppjoone ees (selle puudumisel ristuva sõidutee serva ees), ka siis, kui teel kedagi ei paista, ja seejärel anda teed.",
    svg:`<polygon points="31,4 69,4 96,31 96,69 69,96 31,96 4,69 4,31" fill="${RED}" stroke="#fff" stroke-width="3"/><text x="50" y="60" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="27" fill="#fff">STOP</text>`},
  peatee:{g:"Eesõigusmärgid",n:"Peatee",m:"Sõidad peateel: ristmikel on sul eesõigus kõrvalteelt tulijate ees",
    e:"Kollane romb valge äärisega tähistab peateed. Kõrvalteel liiklejad peavad sulle teed andma.",
    svg:`<rect x="20" y="20" width="60" height="60" transform="rotate(45 50 50)" fill="#fff" stroke="#8A93A6" stroke-width="2"/><rect x="31" y="31" width="38" height="38" transform="rotate(45 50 50)" fill="${YEL}"/>`},
  peateelopp:{g:"Eesõigusmärgid",n:"Peatee lõpp",m:"Peatee lõpeb: edasi ei ole sul enam peatee eesõigust",
    e:"Läbikriipsutatud romb tähendab, et peatee lõpeb. Järgmisel ristmikul juhindud teistest märkidest või parema käe reeglist.",
    svg:`<rect x="20" y="20" width="60" height="60" transform="rotate(45 50 50)" fill="#fff" stroke="#8A93A6" stroke-width="2"/><rect x="31" y="31" width="38" height="38" transform="rotate(45 50 50)" fill="${YEL}"/><g stroke="${BLK}" stroke-width="2.5"><path d="M26 66 L66 26 M30 70 L70 30 M34 74 L74 34"/></g>`},
  sissesoit:{g:"Keelumärgid",n:"Sissesõidukeeld",m:"Sellest suunast on sissesõit kõigile sõidukitele keelatud",
    e:"Punane ring valge rõhtribaga keelab sõidukitel siia sisse sõita (näiteks ühesuunalise tee vastassuunast).",
    svg:`<circle cx="50" cy="50" r="46" fill="${RED}" stroke="#fff" stroke-width="2"/><rect x="18" y="41" width="64" height="18" fill="#fff"/>`},
  liikluskeeld:{g:"Keelumärgid",n:"Liikluskeeld",m:"Liiklemine kõigi sõidukitega on keelatud mõlemas suunas",
    e:"Tühi valge ring punase äärisega keelab kõigi sõidukite liikluse.",
    svg:ring("")},
  peatumiskeeld:{g:"Keelumärgid",n:"Peatumise keeld",m:"Peatuda ja parkida on keelatud",
    e:"Sinine ring punase ääre ja punase ristiga keelab nii peatumise kui ka parkimise märgiga teepoolel.",
    svg:`<clipPath id="cpx"><circle cx="50" cy="50" r="40"/></clipPath><circle cx="50" cy="50" r="44" fill="${BLUE}" stroke="${RED}" stroke-width="10"/><g clip-path="url(#cpx)" stroke="${RED}" stroke-width="9"><path d="M18 18 L82 82 M82 18 L18 82"/></g>`},
  parkimiskeeld:{g:"Keelumärgid",n:"Parkimise keeld",m:"Parkida on keelatud, lühiajaline peatumine on lubatud",
    e:"Sinine ring punase ääre ja ühe kaldkriipsuga keelab parkimise, kuid peatuda (näiteks reisija maha panemiseks) tohib.",
    svg:`<clipPath id="cpp"><circle cx="50" cy="50" r="40"/></clipPath><circle cx="50" cy="50" r="44" fill="${BLUE}" stroke="${RED}" stroke-width="10"/><g clip-path="url(#cpp)" stroke="${RED}" stroke-width="9"><path d="M18 18 L82 82"/></g>`},
  kiirus50:{g:"Keelumärgid",n:"Suurim kiirus",m:"Suurim lubatud sõidukiirus on 50 km/h",
    e:"Number punases ringis näitab suurimat lubatud kiirust. See on ülempiir, mitte soovitus: kiirus tuleb valida vastavalt oludele.",
    svg:ring(`<text x="50" y="64" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="40" fill="${BLK}">50</text>`)},
  moodasoit:{g:"Keelumärgid",n:"Möödasõidukeeld",m:"Mootorsõidukitest möödasõit on keelatud",
    e:"Punane ja must auto punases ringis keelavad möödasõidu märgi mõjualas.",
    svg:ring(car(34,54,RED,1.05)+car(66,54,BLK,1.05))},
  otse:{g:"Kohustusmärgid",n:"Kohustuslik sõidusuund",m:"Sõita tohib ainult otse",
    e:"Sinine ümmargune märk valge noolega kohustab sõitma noole suunas.",
    svg:blueC(`<path d="M50 16 L72 42 H58 V84 H42 V42 H28 Z" fill="#fff"/>`)},
  ringliiklus:{g:"Kohustusmärgid",n:"Ringliiklus",m:"Ristmikul liigutakse ringikujuliselt noolte suunas",
    e:"Kolm ringis olevat noolt tähistavad ringristmikku. Ringil sõidetakse vastupäeva, nagu nooled näitavad.",
    svg:blueC(arcArrow(50,50,23,-60,-150)+arcArrow(50,50,23,60,-30)+arcArrow(50,50,23,180,90))},
  jalgrattatee:{g:"Kohustusmärgid",n:"Jalgrattatee",m:"Tee on ette nähtud jalgratastele",
    e:"Sinine ring valge jalgrattaga tähistab jalgrattateed. Mootorsõidukiga sellel sõita ei tohi.",
    svg:blueC(`<g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="30" cy="60" r="13"/><circle cx="70" cy="60" r="13"/><path d="M30 60 L44 38 H64 L70 60 M44 38 L52 60 L64 38 M40 32 H50 M62 32 L66 30"/></g>`)},
  yhesuunaline:{g:"Teavitusmärgid",n:"Ühesuunaline tee",m:"Tee, kus liiklus toimub ainult ühes suunas",
    e:"Sinine ristkülik ülespoole näitava noolega tähistab ühesuunalist teed. Vastassuunas sõita ei tohi.",
    svg:blueS(`<path d="M50 14 L74 42 H59 V86 H41 V42 H26 Z" fill="#fff"/>`)},
  ylekaigurada:{g:"Teavitusmärgid",n:"Ülekäigurada",m:"Siin on ülekäigurada: jalakäijale tuleb teed anda",
    e:"Sinine ruut valge kolmnurga ja jalakäijaga tähistab ülekäigurada. Juht on kohustatud andma teed jalakäijale, kes on rajal või sinna astumas.",
    svg:blueS(`<path d="M50 12 L90 84 H10 Z" fill="#fff"/><g fill="${BLK}"><rect x="22" y="74" width="10" height="5"/><rect x="38" y="74" width="10" height="5"/><rect x="54" y="74" width="10" height="5"/><rect x="70" y="74" width="10" height="5"/></g>${person(50,66,.9)}`)},

/* ============ INTERSECTION DIAGRAMS ============ */
/* 240x240 crossroads, right-hand traffic. Cars are drawn for the "from south" case and rotated.
   dir: S=0, W=90, N=180, E=270 (degrees clockwise). turn: s(traight), l(eft), r(ight). */
const ROT={S:0,W:90,N:180,E:270};
function rotPt(x,y,deg){const a=deg*Math.PI/180,cx=120,cy=120;return [cx+(x-cx)*Math.cos(a)-(y-cy)*Math.sin(a),cy+(x-cx)*Math.sin(a)+(y-cy)*Math.cos(a)]}
function crossSvg(o){
  const roads=o.roads||"NSWE";
  let s=`<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ristmiku skeem">`;
  s+=`<rect width="240" height="240" fill="var(--verge)"/>`;
  if(roads.includes("N")||roads.includes("S")) s+=`<rect x="80" y="${roads.includes("N")?0:80}" width="80" height="${(roads.includes("N")?80:0)+80+(roads.includes("S")?80:0)}" fill="var(--road)"/>`;
  if(roads.includes("W")||roads.includes("E")) s+=`<rect y="80" x="${roads.includes("W")?0:80}" height="80" width="${(roads.includes("W")?80:0)+80+(roads.includes("E")?80:0)}" fill="var(--road)"/>`;
  const dash=`stroke="var(--roadline)" stroke-width="2" stroke-dasharray="10 8"`;
  if(roads.includes("N")) s+=`<path d="M120 0 V76" ${dash}/>`;
  if(roads.includes("S")) s+=`<path d="M120 164 V240" ${dash}/>`;
  if(roads.includes("W")) s+=`<path d="M0 120 H76" ${dash}/>`;
  if(roads.includes("E")) s+=`<path d="M164 120 H240" ${dash}/>`;
  if(o.tram){s+=`<path d="M114 0 V240 M126 0 V240" stroke="#9AA3B5" stroke-width="2"/>`}
  // signs at approaches (placed on the right-hand verge of each approach)
  for(const [d,id] of Object.entries(o.signs||{})){
    const [x,y]=rotPt(178,180,ROT[d]);
    s+=`<svg x="${(x-15).toFixed(0)}" y="${(y-15).toFixed(0)}" width="30" height="30" viewBox="0 0 100 100">${SIGNS[id].svg}</svg>`;
  }
  const paths={s:"M140 176 V18",r:"M140 176 Q140 140 176 140 H226",l:"M140 176 Q140 100 100 100 H14"};
  for(const c of o.cars||[]){
    const deg=ROT[c.from], col=c.tram?"#2F7BEA":(c.color||"#E39B12");
    s+=`<g transform="rotate(${deg} 120 120)">`;
    s+=`<path d="${c.tram?paths[c.turn].replace("M140","M120").replace("V18","V18"):paths[c.turn]}" fill="none" stroke="${col}" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round"/>`;
    // arrowhead at end
    const ends={s:"M133 22 L140 8 L147 22 Z",r:"M222 133 L236 140 L222 147 Z",l:"M18 93 L4 100 L18 107 Z"};
    s+=`<path d="${ends[c.turn]}" fill="${col}" ${c.tram&&c.turn==="s"?'transform="translate(-20 0)"':""}/>`;
    if(c.tram) s+=`<rect x="${c.from==="N"||c.from==="S"?108:126}" y="176" width="24" height="56" rx="4" fill="${col}" stroke="${BLK}" stroke-width="1.5"/>`;
    else s+=`<rect x="128" y="180" width="24" height="40" rx="6" fill="${col}" stroke="${BLK}" stroke-width="1.5"/><rect x="131" y="186" width="18" height="8" rx="2" fill="#fff" opacity=".7"/>`;
    s+=`</g>`;
    const [lx,ly]=rotPt(c.tram?(c.from==="N"||c.from==="S"?120:138):140,c.tram?212:204,deg);
    s+=`<text x="${lx.toFixed(0)}" y="${(ly+6).toFixed(0)}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-weight="700" font-size="16" fill="${BLK}">${c.label}</text>`;
  }
  for(const p of o.peds||[]){const [x,y]=rotPt(p[0],p[1],0);s+=person(x,y,.7)}
  return s+`</svg>`;
}

 {id:"k1",t:"kiirus",q:"Milline on suurim lubatud kiirus asulas, kui märgid ei näita teisiti?",o:["50 km/h","40 km/h","60 km/h","70 km/h"],e:"Asulasisesel teel on suurim lubatud kiirus 50 km/h.",s:LS+" § 15 lg 1 p 2"},
 {id:"k2",t:"kiirus",q:"Milline on suurim lubatud kiirus asulavälisel teel, kui märgid ei näita teisiti?",o:["90 km/h","100 km/h","110 km/h","80 km/h"],e:"Asulavälisel teel on suurim lubatud kiirus 90 km/h. Märgiga võib Transpordiamet seda oludest sõltuvalt tõsta.",s:LS+" § 15 lg 1 p 1"},
 {id:"k3",t:"kiirus",q:"Milline on suurim lubatud kiirus õuealal?",f:"sign:oueala",o:["20 km/h","10 km/h","30 km/h","Jalakäija kiirus alati"],e:"Õuealal on suurim lubatud kiirus 20 km/h. Jalakäija vahetus läheduses tohib sõita ainult jalakäija kiirusega.",s:LS+" § 15 lg 1 p 6"},
 {id:"k4",t:"kiirus",q:"Milline on suurim lubatud kiirus teise sõiduki pukseerimisel?",o:["50 km/h","30 km/h","70 km/h","90 km/h"],e:"Pukseerimisel on suurim lubatud kiirus 50 km/h.",s:LS+" § 15 lg 1 p 4"},
 {id:"k5",t:"kiirus",q:"Kas asulas võib märgiga lubada suuremat kiirust kui 50 km/h?",o:["Jah, kuni 90 km/h","Ei, asulas on alati kuni 50 km/h","Jah, kuni 120 km/h","Ainult öösel"],e:"Kohalik omavalitsus võib asulasisesel teel oludest sõltuvalt tõsta suurimat lubatud kiirust kuni 90 km/h.",s:LS+" § 15 lg 2"},
 {id:"k6",t:"kiirus",q:"Kui suure kiiruse võib Transpordiamet asulavälisel teel märgiga kõige rohkem lubada?",o:["120 km/h","110 km/h","130 km/h","100 km/h"],e:"Asulavälisel teel võib suurimat lubatud kiirust tõsta kuni 120 km/h. Suvel kehtib paljudel maanteedel 100 või 110 km/h, talvel taas madalam.",s:LS+" § 15 lg 2"},
 {id:"k7",t:"kiirus",q:"Märk näitab 90 km/h, kuid on tihe udu ja nähtavus on halb. Millise kiirusega sõidad?",o:["Nii, et jõuan peatuda nähtava teeosa piires","90 km/h, sest märk lubab","Vähemalt 70 km/h, et mitte liiklust takistada","Sõidan ohutuledega 90 km/h"],e:"Juht peab valima kiiruse vastavalt nähtavusele, teeoludele ja liiklusele. Piirkiirus on ülempiir, mitte soovitus.",s:LS+", sõidukiiruse valik",safe:true},
 {id:"k8",t:"kiirus",q:"Millest koosneb peatumisteekond?",o:["Reageerimisteekonnast ja pidurdusteekonnast","Ainult pidurdusteekonnast","Pidurdusteekonnast ja pikivahest","Reageerimisajast ja pikivahest"],e:"Peatumisteekond on teekond, mille sõiduk läbib ohu märkamisest kuni seismajäämiseni: juhi reageerimise ajal läbitud teekond pluss pidurdusteekond.",s:"Liiklusohutuse alused",safe:true},
 {id:"k9",t:"kiirus",q:"Kuidas muutub pidurdusteekond, kui kiirus kahekordistub (näiteks 40 → 80 km/h)?",o:["Umbes neli korda pikemaks","Kaks korda pikemaks","Jääb samaks","Poole lühemaks"],e:"Pidurdusteekond kasvab ligikaudu kiiruse ruudus: kaks korda suurem kiirus tähendab umbes neli korda pikemat pidurdusteekonda.",s:"Liiklusohutuse alused (füüsika)",safe:true},
 {id:"k10",t:"kiirus",q:"Kui suur peab olema pikivahe ees sõitva sõidukiga?",o:["Nii suur, et ees sõitja järsul pidurdusel jõuaksin kokkupõrketa peatuda","Täpselt 10 meetrit","Ühe auto pikkus","Pikivahe pole oluline, kui pidurid on korras"],e:"Seadus nõuab pikivahet, mis võimaldab kokkupõrget vältida. Rusikareegel kuival teel on vähemalt 2 sekundit, libedal tuleb vahet mitmekordistada.",s:LS+", pikivahe",safe:true},
 {id:"k11",t:"kiirus",q:"Kui suur on soovituslik minimaalne pikivahe kuival teel ajas mõõdetuna?",o:["Umbes 2 sekundit","Umbes 0,5 sekundit","Umbes 10 sekundit","Umbes 1 minut"],e:"Kahe sekundi reegel: kui eessõitja möödub mingist punktist, pead sina sinna jõudma alles umbes 2 sekundi pärast. Märjal ja libedal teel jäta rohkem.",s:"Liiklusohutuse alused (soovitus)",safe:true},
 {id:"k12",t:"kiirus",q:"Milline on mopeedi suurim lubatud kiirus?",o:["45 km/h","25 km/h","50 km/h","60 km/h"],e:"Mopeedi suurim lubatud kiirus on 45 km/h.",s:LS+" § 15 lg 1 p 9"},
 // ---- Manöövrid ----
 {id:"m1",t:"manoover",q:"Kummalt poolt tohib üldjuhul mööda sõita?",o:["Vasakult","Paremalt","Mõlemalt poolt","Paremalt, kui tee on lai"],e:"Möödasõit toimub vasakult. Paremalt tohib mööduda sõidukist, mille juht on andnud märku vasakpöördest ja asunud vasakpöördeks.",s:LS+", möödasõit"},
 {id:"m2",t:"manoover",q:"Sinust sõidab mööda teine sõiduk. Mida sa ei tohi teha?",o:["Kiirust suurendada ega muul viisil möödasõitu takistada","Hoida oma sõidurada","Jätkata sama kiirusega","Vaadata peeglisse"],e:"Juht, kellest möödutakse, ei tohi kiirust suurendada ega möödasõitu muul viisil takistada.",s:LS+", möödasõit"},
 {id:"m3",t:"manoover",q:"Kus on möödasõit keelatud?",o:["Raudteeülesõidukohal","Pikal sirgel asulavälisel teel","Kahesuunalisel teel hea nähtavusega","Kiirteel"],e:"Raudteeülesõidukohal on möödasõit keelatud. Keelatud on see ka näiteks reguleerimata ülekäigurajal ja halva nähtavusega kohas.",s:LS+", möödasõidu keelud"},
 {id:"m4",t:"manoover",q:"Kas suunatule näitamine annab sulle eesõiguse?",o:["Ei, see ainult teavitab teisi kavatsusest","Jah, alati","Jah, kui näitan seda vähemalt 3 sekundit","Ainult ringristmikul"],e:"Suunatuld tuleb näidata aegsasti enne manöövrit, kuid see ei anna eesõigust.",s:LS+", märguanded"},
 {id:"m5",t:"manoover",q:"Kus on tagasipööre keelatud?",o:["Raudteeülesõidukohal","Laial asulateel","Samaliigiliste teede ristmikul","Parklas"],e:"Tagasipööre on keelatud muu hulgas raudteeülesõidukohal, tunnelis ja kohtades, kus nähtavus on piiratud.",s:LS+", tagasipööre"},
 {id:"m6",t:"manoover",q:"Rivistud ümber kõrvalrajale. Samas suunas sõidab sellel rajal teine sõiduk. Kes annab teed?",o:["Mina, kes rivistun ümber","Kõrvalrajal sõitja","See, kes on aeglasem","Kumbki, sest märku andsin"],e:"Ümberrivistuja peab andma teed samas suunas kõrvalrajal sõitjale.",s:LS+", ümberrivistumine"},
 {id:"m7",t:"manoover",q:"Kaks sõidukit rivistuvad korraga teineteise suunas ümber samale rajale. Kes annab teed?",o:["Vasakpoolne annab teed parempoolsele","Parempoolne annab teed vasakpoolsele","Aeglasem annab teed","Suurem sõiduk annab teed"],e:"Samaaegsel ümberrivistumisel annab vasakul olev juht teed paremal olevale.",s:LS+", ümberrivistumine"},
 {id:"m8",t:"manoover",q:"Raudteeülesõidukohal on tõkkepuu laskumas ja punased tuled vilguvad. Mida teed?",o:["Peatun ega sõida ülesõidukohale","Sõidan kiiresti üle enne tõkkepuu sulgumist","Sõidan üle, kui rongi ei paista","Sõidan tõkkepuust mööda vastassuunavööndi kaudu"],e:"Vilkuvad punased tuled ja laskuv või suletud tõkkepuu keelavad ülesõidukohale sõitmise.",s:LS+", raudteeülesõidukoht",safe:true},
 {id:"m9",t:"manoover",q:"Mida tuleb teha enne paremale pööramist?",o:["Asuda aegsasti tee parema serva lähedale ja näidata suunatuld","Asuda tee keskele","Näidata suunatuld alles pöörde ajal","Kiirendada, et pööre kiiresti lõpetada"],e:"Enne paremale pööramist asub juht aegsasti sõidutee parema serva lähedale ja annab suunatulega märku.",s:LS+", pööramine"},
 {id:"m10",t:"manoover",q:"Mis on kiirteel keelatud?",o:["Tagasipööre ja tagurdamine","Sõitmine vasakpoolsel sõidurajal möödasõiduks","Sõitmine kiirusega 90 km/h","Suunatule kasutamine"],e:"Kiirteel on keelatud tagasipööre, tagurdamine ja sõitmine eraldusriba vaheavadest.",s:LS+", kiirteel sõitmine"},
 {id:"m11",t:"manoover",q:"Tagurdamisel ei näe sa hästi, mis on auto taga. Mida peaksid tegema?",o:["Veenduma ohutuses, vajadusel kasutama kõrvalise isiku abi","Tagurdama kiiresti, et mitte kaua takistada","Lootma ainult helisignaalile","Tagurdama ohutuledega"],e:"Tagurdades peab juht veenduma, et see on ohutu, ja vajaduse korral kasutama kõrvalise isiku abi.",s:LS+", tagurdamine"},
 // ---- Peatumine ----
 {id:"p1",t:"parkimine",q:"Mis vahe on märkidel „Peatumise keeld“ ja „Parkimise keeld“?",f:"sign:parkimiskeeld",o:["Parkimiskeelu korral tohib lühidalt peatuda, peatumiskeelu korral mitte","Vahet pole","Peatumiskeeld kehtib ainult öösel","Parkimiskeeld kehtib ainult veokitele"],e:"Peatumise keeld (rist) keelab ka lühiajalise peatumise. Parkimise keeld (üks kriips) lubab peatuda, näiteks reisijate peale ja maha minekuks.",s:LKV},
 {id:"p2",t:"parkimine",q:"Kui lähedal ülekäigurajale tohib selle ees peatuda?",o:["Mitte lähemal kui 5 m","Mitte lähemal kui 1 m","Vahetult ülekäiguraja ees","Mitte lähemal kui 50 m"],e:"Peatumine on keelatud ülekäigurajal ja lähemal kui 5 m enne seda, et seisev auto ei varjaks jalakäijaid.",s:LS+", peatumise keelud"},
 {id:"p3",t:"parkimine",q:"Kus on peatumine keelatud?",o:["Raudteeülesõidukohal","Parklas","Teepeenral, kui märk lubab","Tee paremas servas asulas"],e:"Peatumine on keelatud muu hulgas raudteeülesõidukohal, tunnelis ja ülekäigurajal.",s:LS+", peatumise keelud"},
 {id:"p4",t:"parkimine",q:"Asulas ühesuunalise sõiduteega teel tahad peatuda. Kummas servas tohib?",o:["Paremas või vasakus servas","Ainult paremas servas","Ainult vasakus servas","Ainult sõidutee keskel"],e:"Üldjuhul peatutakse paremas servas, kuid asulas ühesuunalise sõiduteega teel võib peatuda ka vasakus servas.",s:LS+", peatumine ja parkimine"},
 {id:"p5",t:"parkimine",q:"Lähed seisvast autost välja vasakpoolse ukse kaudu. Mida pead tegema?",o:["Veenduma, et ukse avamine ei ohusta teisi, näiteks jalgratturit","Avama ukse kiiresti, et mitte liiklust takistada","Andma helisignaali","Mitte midagi erilist"],e:"Sõiduki ust tohib avada alles siis, kui see ei ohusta ega takista teisi liiklejaid.",s:LS+", sõitjate kohustused",safe:true},
 {id:"p6",t:"parkimine",q:"Mida tuleb teha enne autost lahkumist, kui jätad selle seisma?",o:["Rakendada seisupidur ja võtta meetmed, et auto ei hakkaks iseeneslikult liikuma","Jätta mootor tööle","Jätta auto käiku ilma seisupidurita","Lülitada sisse kaugtuled"],e:"Juht peab enne sõidukist lahkumist tagama, et sõiduk ei saaks iseeneslikult liikuma hakata ega seda saaks kasutada keegi kõrvaline.",s:LS+", juhi kohustused"},
 {id:"p7",t:"parkimine",q:"Kui lähedal ristmikule tohib peatuda?",o:["Mitte lähemal kui 5 m ristuva sõidutee servast","Vahetult ristmikul, kui ohutuled põlevad","Mitte lähemal kui 1 m","Kuitahes lähedal"],e:"Peatumine on keelatud ristmikul ja lähemal kui 5 m ristuva sõidutee servast.",s:LS+", peatumise keelud"},
 // ---- Jalakäijad ----
 {id:"j1",t:"jalakaija",q:"Reguleerimata ülekäigurajale astub jalakäija. Mida teed?",f:"sign:ylekaigurada",o:["Annan jalakäijale teed","Sõidan edasi, sest olen juba lähedal","Annan helisignaali ja sõidan","Annan teed ainult lapsele"],e:"Juht on kohustatud andma teed jalakäijale, kes on ülekäigurajal või sinna astumas.",s:LS+" § 2 p 100"},
 {id:"j2",t:"jalakaija",q:"Sõidurajal sinu kõrval peatus auto ülekäiguraja ees. Mida pead tegema?",o:["Peatuma või aeglustama ja jätkama alles siis, kui olen veendunud, et rajal pole jalakäijat","Mööduma kiiresti","Mööduma, sest kõrvalrajal seisja annab teed","Andma helisignaali"],e:"Peatunud auto võib varjata jalakäijat. Jätkata tohib alles siis, kui oled veendunud, et ülekäigurajal ei ole jalakäijat.",s:LS+", ülekäigurajal sõitmine",safe:true},
 {id:"j3",t:"jalakaija",q:"Jalakäija ületab teed ülekäigukohas (märgistuseta), sina sõidad otse. Kellel on eesõigus?",o:["Juhil","Jalakäijal","Sellel, kes on paremalt","Mõlemal"],e:"Ülekäigukohas pole jalakäijal juhi ees eesõigust. Erand: kui juht pöörab teele, mida jalakäija ületab, peab juht andma teed.",s:LS+" § 2 p 99"},
 {id:"j4",t:"jalakaija",q:"Pöörad paremale ja ristuvat teed, millele pöörad, ületab jalakäija. Mida teed?",o:["Annan jalakäijale teed","Sõidan enne jalakäijat","Annan helisignaali","Pööran laia kaarega ümber jalakäija"],e:"Pöörates peab juht andma teed teed ületavale jalakäijale, kelle teed ta ristub.",s:LS+", pööramine"},
 {id:"j5",t:"jalakaija",q:"Pöörad paremale üle jalgrattatee, millel sõidab jalgrattur otse. Kes annab teed?",o:["Mina","Jalgrattur","See, kes on aeglasem","Kumbki"],e:"Pöörav juht peab andma teed jalgrattateel otse sõitvale jalgratturile.",s:LS+", pööramine"},
 {id:"j6",t:"jalakaija",q:"Teel liigub valge kepiga jalakäija. Mida see tähendab?",o:["Ta on nägemispuudega, pean olema eriti ettevaatlik ja andma teed","Ta on liiklusreguleerija","Ta on teetööline","Midagi erilist see ei tähenda"],e:"Valge kepp tähistab nägemispuudega inimest. Juht peab olema eriti tähelepanelik ja talle teed andma.",s:LS+", juhi kohustused"},
 {id:"j7",t:"jalakaija",q:"Miks peab jalakäija pimedal ajal kandma helkurit?",o:["Lähituledes nähakse helkuriga jalakäijat palju kaugemalt","Helkur on ainult laste jaoks","Helkur asendab ülekäigurada","Helkur annab jalakäijale eesõiguse"],e:"Helkurita tumedalt riides jalakäija märkab juht lähitulede valgel alles väga lähedalt. Helkuriga märkab ta teda mitu korda kaugemalt.",s:LS+", jalakäija kohustused",safe:true},
 {id:"j8",t:"jalakaija",q:"Õuealal kõnnib jalakäija keset teed. Mida teed?",o:["Sõidan jalakäija kiirusega ja olen valmis peatuma","Annan helisignaali, et ta läheks kõnniteele","Sõidan 20 km/h temast mööda","Sõidan tagasi"],e:"Õuealal tohib jalakäija kasutada kogu tee laiust. Jalakäija vahetus läheduses tohib sõita ainult jalakäija kiirusega.",s:LS+" § 15 lg 1 p 6"},
 {id:"j9",t:"jalakaija",q:"Lähened teel seisvale bussile, millest väljuvad lapsed. Mida teed?",o:["Vähendan kiirust ja olen valmis peatuma","Annan helisignaali ja sõidan mööda","Sõidan kiiresti mööda","Jätkan endise kiirusega"],e:"Lapsed võivad bussi tagant ootamatult teele joosta. Vähenda kiirust ja ole valmis peatuma.",s:LS+", juhi kohustused",safe:true},
 // ---- Ohutus ----
 {id:"o1",t:"ohutus",q:"Millisest alkoholisisaldusest alates loetakse mootorsõidukijuht joobeseisundis olevaks?",o:["0,20 promilli veres või 0,10 mg/l väljahingatavas õhus","0,50 promilli veres","1,5 promilli veres","Igasugune alkoholi lõhn"],e:"Mootorsõidukijuht on joobeseisundis, kui tema veres on alkoholi 0,20 promilli või rohkem või väljahingatavas õhus 0,10 mg/l või rohkem. Kõige kindlam on mitte juua üldse.",s:LS+" § 69",safe:true},
 {id:"o2",t:"ohutus",q:"Õhtul jõid alkoholi. Mis kiirendab alkoholi organismist väljumist?",o:["Ainult aeg, midagi muud ei kiirenda","Kange kohv","Külm dušš","Uni kahe tunni jooksul"],e:"Alkohol laguneb organismis ühtlaselt ja seda ei saa kiirendada. Hommikul võib veres olla veel jääkalkoholi.",s:"Liiklusohutuse alused",safe:true},
 {id:"o3",t:"ohutus",q:"Tunned sõidu ajal väsimust ja haigutad. Mida teed?",o:["Peatun ohutus kohas ja puhkan","Avan akna ja jätkan","Keeran muusika valjemaks","Sõidan kiiremini, et sihtpunkt kiiremini kätte jõuaks"],e:"Väsimus aeglustab reageerimist nagu alkohol. Ainus tõhus abinõu on peatuda ja puhata.",s:"Liiklusohutuse alused",safe:true},
 {id:"o4",t:"ohutus",q:"Kas sõidu ajal võib telefoni käes hoides rääkida?",o:["Ei, käeshoitavat telefoni ei tohi kasutada","Jah, kui kõne on lühike","Jah, ainult asulas","Jah, ummikus"],e:"Sõidu ajal on keelatud kasutada käeshoitavat telefoni. Ka vabakäeseade hajutab tähelepanu.",s:LS+", juhi keelud",safe:true},
 {id:"o5",t:"ohutus",q:"Kes peavad sõiduautos kasutama turvavööd?",o:["Kõik sõitjad, ka tagaistmel","Ainult juht","Juht ja esiistmel sõitja","Ainult asulavälisel teel"],e:"Turvavöö peab olema kinnitatud kõigil sõitjatel, nii ees kui ka taga.",s:LS+", turvavöö kasutamine",safe:true},
 {id:"o6",t:"ohutus",q:"Kas seljaga sõidusuunas lapse turvahälli võib panna esiistmele, mille ees on sisselülitatud turvapadi?",o:["Ei","Jah","Jah, kui laps on üle 1 aasta","Jah, lühikestel sõitudel"],e:"Avanev turvapadi võib last raskelt vigastada. Seljaga sõidusuunas turvahälli ei tohi paigaldada aktiveeritud turvapadjaga istmele.",s:LS+", laste sõidutamine",safe:true},
 {id:"o7",t:"ohutus",q:"Kas väikest last võib autos sõidutada süles?",o:["Ei, laps peab olema kinnitatud tema pikkusele ja kaalule sobiva turvavarustusega","Jah, kui sõit on lühike","Jah, tagaistmel","Jah, kui täiskasvanu on kinnitatud"],e:"Laps tuleb kinnitada tema kasvule ja kaalule vastava turvavarustusega. Kokkupõrkel ei suuda keegi last süles kinni hoida.",s:LS+", laste sõidutamine",safe:true},
 {id:"o8",t:"ohutus",q:"Märjal teel tekib vesiliug (rehvid kaotavad haardumise). Mida teed?",o:["Vabastan gaasipedaali ja hoian rooli otse, järsult ei pidurda","Pidurdan täiest jõust","Keeran rooli järsult","Lisan gaasi"],e:"Vesiliu korral vabasta gaas ja hoia rool otse, kuni rehvid saavad uuesti teepinnaga kontakti.",s:"Liiklusohutuse alused",safe:true},
 {id:"o9",t:"ohutus",q:"Kuidas pidurdada hädaolukorras autoga, millel on ABS?",o:["Vajutan pidurit täiest jõust ja hoian all","Pumpan pidurit","Pidurdan ainult seisupiduriga","Lülitan mootori välja"],e:"ABS hoiab rattad pöörlemas ja auto juhitavana. Pidurit tuleb vajutada täiest jõust ja hoida.",s:"Liiklusohutuse alused",safe:true},
 {id:"o10",t:"ohutus",q:"Vastutuleva auto tuled pimestavad sind. Mida teed?",o:["Vähendan kiirust ja vaatan tee paremale servale","Lülitan oma kaugtuled sisse","Sulgen hetkeks silmad","Kiirendan"],e:"Pimestamisel vähenda kiirust, vajadusel peatu, ja vaata tee parema serva poole. Kaugtuledega vastu pimestamine on ohtlik ja keelatud.",s:LS+", tulede kasutamine",safe:true},
 {id:"o11",t:"ohutus",q:"Kuidas läbida järsku kurvi?",o:["Vähendan kiirust enne kurvi, kurvis hoian ühtlast kiirust","Pidurdan kurvi keskel","Kiirendan kurvi sisenedes","Lõikan kurvi vastassuunavööndi kaudu"],e:"Pidurdamine kurvis võib põhjustada libisemise. Kiirus tuleb sobivaks vähendada enne kurvi.",s:"Liiklusohutuse alused",safe:true},
 {id:"o12",t:"ohutus",q:"Kuidas peab pikivahe muutuma libedal teel?",o:["Suurenema mitu korda","Jääma samaks","Vähenema","Pikivahe pole libedal oluline"],e:"Libedal teel on pidurdusteekond mitu korda pikem. Sama palju peab suurendama ka pikivahet.",s:LS+", pikivahe",safe:true},
 {id:"o13",t:"ohutus",q:"Võtad ravimit, mille infolehel on hoiatus autojuhtimise kohta. Mida teed?",o:["Ei juhi, kui ravim võib mõjutada juhtimisvõimet","Juhin, sest ravim on apteegist","Juhin ainult päeval","Juhin aeglasemalt"],e:"Mõned ravimid aeglustavad reageerimist või põhjustavad uimasust. Sellises seisundis on juhtimine keelatud.",s:LS+", juhi keelud",safe:true},
 {id:"o14",t:"ohutus",q:"Hämaras ilmub teele põder. Mida teed?",o:["Pidurdan jõuliselt ja arvestan, et loom võib liikuda ootamatult","Kiirendan, et jõuda enne looma mööda","Annan helisignaali ja jätkan sama kiirusega","Lülitan tuled välja"],e:"Põder võib liikuda ettearvamatult. Pidurda jõuliselt ja väldi järske manöövreid vastassuunavööndisse.",s:"Liiklusohutuse alused",safe:true},

function signOptions(id){
  const me=SIGNS[id], same=[], other=[];
  for(const [k,s] of Object.entries(SIGNS)){ if(k===id) continue; (s.g===me.g?same:other).push(s.m) }
  const pick=(arr,n)=>shuffle(arr.slice()).slice(0,n);
  const d=pick(same,2); d.push(...pick(other.filter(x=>!d.includes(x)),3-d.length));
  return [me.m,...d];
}

/* ---- Intersection generator: endless right-of-way tasks, solved by the rules ---- */
const RIGHT_OF={S:"E",E:"N",N:"W",W:"S"}, OPP={S:"N",N:"S",E:"W",W:"E"}, TURN={s:"sõidab otse",l:"pöörab vasakule",r:"pöörab paremale"};
function pathPts(from,turn,tram){
  const P=[]; const deg=ROT[from]; const x0=tram?120:140;
  const add=(x,y)=>P.push(rotPt(x,y,deg));
  if(turn==="s"){for(let y=176;y>=18;y-=6)add(x0,y)}
  else if(turn==="r"){for(let t=0;t<=1;t+=.05){const u=1-t;add(u*u*140+2*u*t*140+t*t*176,u*u*176+2*u*t*140+t*t*140)}for(let x=180;x<=226;x+=6)add(x,140)}
  else{for(let t=0;t<=1;t+=.05){const u=1-t;add(u*u*140+2*u*t*140+t*t*100,u*u*176+2*u*t*100+t*t*100)}for(let x=96;x>=14;x-=6)add(x,100)}
  return P;
}
function conflict(a,b){const A=pathPts(a.from,a.turn,a.tram),B=pathPts(b.from,b.turn,b.tram);for(const p of A)for(const q of B)if(Math.hypot(p[0]-q[0],p[1]-q[1])<12)return true;return false}
// does a have to give way to b? returns {y:bool, why} or null when the case is not clear-cut
function yields(a,b,main){
  if(main){const am=main.includes(a.from),bm=main.includes(b.from); if(am!==bm) return {y:!am,why:am?null:"main"};}
  if(!main){ if(b.tram&&!a.tram) return {y:true,why:"tram"}; if(a.tram&&!b.tram) return {y:false}; }
  if(OPP[a.from]===b.from){ if(a.turn==="l"&&b.turn!=="l") return {y:true,why:"left"}; if(b.turn==="l"&&a.turn!=="l") return {y:false}; return null; }
  if(RIGHT_OF[a.from]===b.from) return {y:true,why:"right"};
  if(RIGHT_OF[b.from]===a.from) return {y:false};
  return null;
}
function reason(a,b,why,main,signs){ const A=a.nm[0].toUpperCase()+a.nm.slice(1), Bn=b.nm;
  if(LANG==="ru"){const G=RU.gen; if(why==="main")return G.rMain(A,b.dat,signs[a.from]==="stop"); if(why==="tram")return G.rTram(a.nm); if(why==="left")return G.rLeft(A,b.dat,G.turn[b.turn]); if(why==="right")return G.rRight(a.dat,b.nm,main); return "";}
  if(why==="main") return `${A} on kõrvalteel (märk „${signs[a.from]==="stop"?"STOP":"Anna teed"}“) ja peab andma teed peateel sõitvale ${Bn}-le.`;
  if(why==="tram") return `Samaliigiliste teede ristmikul on trammil eesõigus, seega ${a.nm} annab teed trammile.`;
  if(why==="left") return `Vasakule pöörav ${a.nm} annab teed vastassuunast tulevale ${Bn}-le, kes ${TURN[b.turn]}.`;
  if(why==="right") return `${main?"Mõlemad on samal teel, seega kehtib nende vahel parema käe reegel: ":"Parema käe reegel: "}${Bn} läheneb ${a.nm}-le paremalt.`;
  return "";
}
function solve(cars,main,signs){ // returns {order, steps} or null
  const left=cars.slice(), order=[], steps=[];
  while(left.length){
    const free=left.filter(c=>left.every(d=>{ if(d===c||!conflict(c,d)) return true; const r=yields(c,d,main); if(!r) throw 0; return !r.y }));
    if(free.length!==1) return null;
    const c=free[0];
    for(const d of left){ if(d!==c&&conflict(c,d)){ const r=yields(d,c,main); if(r&&r.y) steps.push(reason(d,c,r.why,main,signs)) } }
    order.push(c); left.splice(left.indexOf(c),1);
  }
  return {order,steps};
}
function genCross(kind){
  for(let tries=0;tries<400;tries++){
    const dirs=shuffle(["S","N","W","E"]), n=kind==="x3"?3:2;
    const cars=dirs.slice(0,n).map(d=>({from:d,turn:["s","l","r"][Math.floor(Math.random()*3)]}));
    let main=null, signs={}, tram=false;
    if(kind==="xm"){ main=Math.random()<.5?["N","S"]:["W","E"]; const stop=Math.random()<.3;
      for(const d of ["N","S","W","E"]) signs[d]=main.includes(d)?"peatee":(stop?"stop":"anna");
      if(!cars.some(c=>main.includes(c.from))||!cars.some(c=>!main.includes(c.from))) continue; }
    if(kind==="xt"){ const tc=cars.find(c=>c.from==="N"||c.from==="S"); if(!tc) continue; tc.tram=true; tc.turn="s"; tram=true;
      if(cars.some(c=>!c.tram&&(c.from==="N"||c.from==="S"))) continue; }
    const letters=shuffle(["1","2","3"].slice(0,n)); const G=RU.gen, ru=LANG==="ru"; cars.forEach((c,i)=>{c.label=c.tram?"T":letters[i];c.nm=ru?(c.tram?G.tram:G.car(letters[i])):(c.tram?"tramm":"auto "+letters[i]);c.dat=ru?(c.tram?G.tramDat:G.carDat(letters[i])):c.nm});
    if(cars.some((c,i)=>cars.some((d,j)=>j>i&&!conflict(c,d)))&&n===2) continue;
    let sol; try{ sol=solve(cars,main,signs) }catch(e){ continue }
    if(!sol) continue;
    const pal=["#E39B12","#2FA35B","#9B5CD6"];
    const fig=crossSvg({signs,tram,cars:cars.map((c,i)=>({...c,color:pal[i]}))});
    const moves=cars.map((c,i)=>`${i?c.nm:c.nm[0].toUpperCase()+c.nm.slice(1)} ${(ru?G.turn:TURN)[c.turn]}`).join(", ")+".";
    const ctx=ru?(main?G.ctxMain:G.ctxEq):(main?"Ristmikul on peatee ja kõrvalteed (vaata märke).":"Samaliigiliste teede ristmik, märke ega foori pole.");
    const name=c=>c.nm[0].toUpperCase()+c.nm.slice(1);
    let q,o;
    if(n===3){ const cap=x=>x[0].toUpperCase()+x.slice(1); const corr=cap(sol.order.map(c=>c.nm).join(", ")); const perms=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]].map(p=>cap(p.map(i=>cars[i].nm).join(", ")));
      q=`${ctx} ${moves} ${ru?G.order:"Mis järjekorras sõidukid ristmiku läbivad?"}`; o=[corr,...shuffle(perms.filter(x=>x!==corr)).slice(0,3)]; }
    else{ const first=sol.order[0], second=sol.order[1], askYield=Math.random()<.5;
      q=`${ctx} ${moves} `+(askYield?(ru?G.whoYield:"Kumb peab teed andma?"):(ru?G.whoFirst:"Kumb sõidab esimesena?"));
      o=askYield?[name(second),name(first),...(ru?G.oYield:["Kumbki ei pea teed andma","Mõlemad peavad peatuma"])]:[name(first),name(second),...(ru?G.oFirst:["Mõlemad korraga","See, kes jõudis ristmikule varem"])]; }
    const src=main?LKV+"; "+LS+", eesõigus ristmikul":LS+", ristmikul sõitmine"; return {q,o,f:fig,e:sol.steps.join(" "),s:ru?trSrc(src):src};
  }
  return null;
}

function reverseSignOptions(id){

  jalgrattatee:{n:"Велосипедная дорожка",m:"Дорога предназначена для велосипедов",e:"Синий круг с белым велосипедом обозначает велосипедную дорожку. Ездить по ней на автомобиле нельзя."},
  yhesuunaline:{n:"Дорога с односторонним движением",m:"Дорога, где движение идёт только в одном направлении",e:"Синий прямоугольник со стрелкой вверх обозначает дорогу с односторонним движением. Ехать во встречном направлении нельзя."},
  ylekaigurada:{n:"Пешеходный переход",m:"Здесь пешеходный переход: пешеходу нужно уступить дорогу",e:"Синий квадрат с белым треугольником и пешеходом обозначает пешеходный переход. Водитель обязан уступить дорогу пешеходу, который находится на переходе или вступает на него."},
  oueala:{n:"Жилая зона",m:"Начинается жилая зона: максимальная скорость 20 км/ч, пешеходы могут идти по всей ширине дороги",e:"Жилая зона предназначена для одновременного движения пешеходов и транспорта. Максимальная скорость 20 км/ч, а рядом с пешеходом нужно ехать со скоростью пешехода."},
  ouealalopp:{n:"Конец жилой зоны",m:"Жилая зона заканчивается: дальше действуют обычные правила",e:"Знак жилой зоны с красной наклонной полосой обозначает её конец. Выезжающий из жилой зоны должен уступить дорогу другим участникам движения."},
  parkla:{n:"Место стоянки",m:"Место, предназначенное для стоянки",e:"Синий квадрат с белой буквой P обозначает место стоянки (парковку)."},
  kurv:{n:"Опасный поворот",m:"Впереди опасный поворот направо",e:"Предупреждающие знаки — треугольники с красной каймой. Этот предупреждает о крутом повороте: снижайте скорость до поворота, а не в нём."},
  lapsed:{n:"Дети",m:"Впереди место, где на дорогу могут неожиданно выйти дети",e:"Знак предупреждает о детях (школа, детский сад, игровая площадка). Будьте особенно внимательны и готовы остановиться."},
  metsloomad:{n:"Дикие животные",m:"На дорогу могут выйти дикие животные",e:"Знак предупреждает о диких животных (например, лосях). Особенно в сумерках будьте готовы тормозить."},
  teetood:{n:"Дорожные работы",m:"Впереди дорожные работы",e:"Знак предупреждает о дорожных работах. Там могут быть рабочие, техника и сужения, езжайте осторожно."},
  raudtee:{n:"Железнодорожный переезд без шлагбаума",m:"Впереди железнодорожный переезд без шлагбаума",e:"Знак предупреждает о переезде без шлагбаума. Перед рельсами убедитесь, что поезд не приближается."},
  libe:{n:"Скользкая дорога",m:"Впереди скользкий участок дороги",e:"Знак предупреждает о скользкой дороге. Снизьте скорость, увеличьте дистанцию и избегайте резких движений."},
  kahesuunaline:{n:"Двустороннее движение",m:"Впереди начинается участок с двусторонним движением",e:"Две встречные стрелки предупреждают, что после одностороннего движения начинается двустороннее."},
  foorhoiatus:{n:"Светофорное регулирование",m:"Впереди участок, регулируемый светофором",e:"Знак предупреждает о светофоре, который может быть плохо виден издалека."},
  ylekaighoiatus:{n:"Пешеходный переход (предупреждающий)",m:"Вы приближаетесь к пешеходному переходу",e:"Предупреждающий знак заранее сообщает о пешеходном переходе. Будьте готовы уступить дорогу пешеходу."},
 },
